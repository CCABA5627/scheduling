<script>
// ===================== SUPABASE =====================
const SUPABASE_URL = 'https://ziyuuprfoozzlcdtxhlt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppeXV1cHJmb296emxjZHR4aGx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNTk3NDEsImV4cCI6MjA5NzczNTc0MX0.26hwhypq0elib35SFGa7ErLmgmAtpIoOnUIZ6_eALQ0';

async function pushToPortal() {
  const btn = document.getElementById('push-btn');
  const status = document.getElementById('push-status');
  btn.disabled = true;
  btn.textContent = 'Pushing...';
  status.textContent = '';
  try {
    const today = new Date().toISOString().split('T')[0];
    const todayDay = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
    const rows = [];
    S.clients.forEach(c => {
      (c.schedule[todayDay] || []).forEach(blk => {
        if (!blk.staffId) return;
        const staffMember = gsN(blk.staffId);
        if (!staffMember || S.calledOut.includes(blk.staffId)) return;
        rows.push({ staff: staffMember.name, client: c.name, time: blk.from + ' \u2013 ' + blk.to, location: 'Center', date: today });
      });
    });
    (S.tempBlocks || []).filter(tb => tb.day === todayDay && tb.staffId).forEach(tb => {
      const staffMember = gsN(tb.staffId);
      const client = gcN(tb.cid);
      if (!staffMember || !client) return;
      rows.push({ staff: staffMember.name, client: client.name, time: tb.from + ' \u2013 ' + tb.to, location: 'Center', date: today });
    });
    await fetch(`${SUPABASE_URL}/rest/v1/assignments?date=eq.${today}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
    });
    if (rows.length > 0) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/assignments`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify(rows)
      });
      if (!res.ok) throw new Error('Insert failed: ' + res.status);
    }
    const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    status.textContent = '\u2713 Pushed ' + rows.length + ' assignments at ' + time;
    status.style.color = '#1D9E75';
    showToast('\u2713 ' + rows.length + ' assignments pushed to Staff Portal!', false);
  } catch(e) {
    status.textContent = '\u26a0 Push failed \u2014 check connection';
    status.style.color = '#D85A30';
    showToast('Push failed: ' + e.message, true);
  }
  btn.disabled = false;
  btn.innerHTML = '&#x1F4E4; Push to Staff Portal';
}

// ===================== SCHEDULER =====================
const DAYS=['Mon','Tue','Wed','Thu','Fri'];
const ALL_DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function bT(){const o=[];for(let h=8;h<=17;h++){for(let m=0;m<60;m+=15){if(h===17&&m>0)break;const ap=h<12?'AM':'PM';const h12=h===0?12:h>12?h-12:h;o.push(`${h12}:${m===0?'00':m} ${ap}`);}}return o;}
const TIMES=bT();
function t2m(t){const[ti,ap]=t.split(' ');const[h,m]=ti.split(':').map(Number);let hr=h;if(ap==='PM'&&h!==12)hr=h+12;if(ap==='AM'&&h===12)hr=0;return hr*60+m;}
// Given the last slot in an availability array, return the actual end time (next 15-min boundary)
function availEnd(sl){const idx=TIMES.indexOf(sl[sl.length-1]);return TIMES[idx+1]||sl[sl.length-1];}
const SK='podscheduler_v4';

const DD={
  clients:[
    {id:'c1',name:'Margaret T.',schedule:{Mon:[{from:'9:00 AM',to:'12:45 PM',staffId:'s1'},{from:'1:00 PM',to:'4:45 PM',staffId:'s2'}],Wed:[{from:'9:00 AM',to:'10:00 AM',staffId:'s3'}],Fri:[{from:'9:00 AM',to:'11:00 AM',staffId:'s1'}]}},
    {id:'c2',name:'David R.',schedule:{Tue:[{from:'10:00 AM',to:'12:00 PM',staffId:'s2'}],Thu:[{from:'10:00 AM',to:'11:00 AM',staffId:'s4'}]}},
    {id:'c3',name:'Linda K.',schedule:{Mon:[{from:'1:00 PM',to:'2:00 PM',staffId:'s3'}],Wed:[{from:'1:00 PM',to:'3:00 PM',staffId:'s2'}]}},
    {id:'c4',name:'James B.',schedule:{Mon:[{from:'9:00 AM',to:'9:30 AM',staffId:'s1'}],Tue:[{from:'9:00 AM',to:'10:00 AM',staffId:'s4'}],Thu:[{from:'9:00 AM',to:'10:00 AM',staffId:'s4'}]}},
    {id:'c5',name:'Sandra W.',schedule:{Wed:[{from:'10:00 AM',to:'11:00 AM',staffId:'s5'}],Fri:[{from:'10:00 AM',to:'12:00 PM',staffId:'s5'}]}},

function slotsInBlock(from,to){const lo=t2m(from),hi=t2m(to);if(lo===hi)return TIMES.filter(t=>t2m(t)===lo);return TIMES.filter(t=>t2m(t)>=lo&&t2m(t)<hi);}

function openAssignModal(cid,day,blockIdx,isTemp,tempId){
  const c=gcN(cid);let blockFrom,blockTo,currentSid,slots,blk;
  if(isTemp){blk=S.tempBlocks.find(t=>t.id===tempId);if(!blk)return;blockFrom=blk.slots[0];blockTo=blk.slots[blk.slots.length-1];currentSid=blk.staffId;slots=blk.slots;}
  else{blk=(c?.schedule[day]||[])[blockIdx];if(!blk)return;blockFrom=blk.from;blockTo=blk.to;currentSid=blk.staffId;slots=slotsInBlock(blk.from,blk.to);}
  const range=blockFrom+(blockFrom!==blockTo?' \u2013 '+blockTo:'');
  document.getElementById('modal-title-text').textContent=(c?.name||'?')+' \u00b7 '+day+' '+range;
  const pod=S.pods[cid]||[];
  const podSet=new Set(pod);
  const usedOther=new Set();
  (c?.schedule[day]||[]).forEach((blk2,i2)=>{if(!isTemp&&i2===blockIdx)return;if(blk2.staffId)usedOther.add(blk2.staffId);});
  S.tempBlocks.forEach(tb=>{if(tb.cid!==cid||tb.day!==day||tb.id===tempId)return;if(tb.staffId)usedOther.add(tb.staffId);});

  // Conflict check that respects cancelled clients
  function chkConflict(sid,newSlots,excCid,excBlockIdx,excTempId){
    const conflicts=[];const ns=new Set(newSlots);
    S.clients.forEach(cl=>{
      if(S.calledOutClients.includes(cl.id))return;
      (cl.schedule[day]||[]).forEach((blk,idx)=>{
        if(blk.staffId!==sid)return;
        if(cl.id===excCid&&idx===excBlockIdx)return;
        const ov=slotsInBlock(blk.from,blk.to).filter(s=>ns.has(s));
        if(ov.length>0)conflicts.push({name:cl.name,from:blk.from,to:blk.to});
      });
    });
    (S.tempBlocks||[]).forEach(tb=>{
      if(tb.staffId!==sid||tb.day!==day)return;
      if(tb.id===excTempId)return;
      if(S.calledOutClients.includes(tb.cid))return;
      const ov=tb.slots.filter(s=>ns.has(s));
      if(ov.length>0)conflicts.push({name:gcN(tb.cid)?.name||'?',from:tb.from,to:tb.to});
    });
    return{hasConflict:conflicts.length>0,conflicts};
  }

  // Compute which slots are already covered by existing splits
  const alreadyCoveredSlots=new Set();
  if(blk?.splits){
    blk.splits.forEach(sp=>slotsInBlock(sp.from,sp.to).forEach(sl=>{if(slots.includes(sl))alreadyCoveredSlots.add(sl);}));
  } else if(blk?.staffId){
    const pav=new Set(gsN(blk.staffId)?.availability[day]||[]);
    slots.forEach(sl=>{if(pav.has(sl))alreadyCoveredSlots.add(sl);});
  }
  const remainingSlots=slots.filter(sl=>!alreadyCoveredSlots.has(sl));

  // How many of the block's slots does this staff member's availability cover?
  function getAvailSlots(sid){
    const av=new Set(gsN(sid)?.availability[day]||[]);
    return slots.filter(sl=>av.has(sl));
  }
  // What portion of the REMAINING uncovered slots can this staff fill?
  function getContribSlots(sid){
    const av=new Set(gsN(sid)?.availability[day]||[]);
    const pool=remainingSlots.length?remainingSlots:slots;
    return pool.filter(sl=>av.has(sl));
  }
  function slotEndDisplay(slotTime,cap){
    const idx=TIMES.indexOf(slotTime);const next=TIMES[idx+1];
    return(next&&t2m(next)<=t2m(cap))?next:cap;
  }
  // Describe the time range a staff member would cover (their contribution to the gap)
  function descContrib(contribSlots){
    if(!contribSlots.length)return null;
    const from=contribSlots[0];
    const displayEnd=slotEndDisplay(contribSlots[contribSlots.length-1],blockTo);
    const mins=contribSlots.length*15;
    const dur=mins>=60?Math.floor(mins/60)+'h'+(mins%60?' '+mins%60+'m':''):(mins+'m');
    return`Would cover ${from} \u2013 ${displayEnd} (${dur})`;
  }

  function staffRow(sid,subText,isCur,hasConflict,note,extraStyle,mode){
    const s=gsN(sid);
    const assignFn=mode==='partial'
      ?`doAssignPartial('${cid}','${day}',${isTemp?-1:blockIdx},'${sid}','${tempId||''}')`
      :`doAssign('${cid}','${day}',${isTemp?-1:blockIdx},'${sid}','${tempId||''}')`;
    return`<div class="staff-opt${isCur?' current':''}" style="${hasConflict?'border:1.5px solid #F0997B;':''}${extraStyle||''}" onclick="${assignFn}">
      <div class="av av-s" style="width:28px;height:28px;font-size:10px">${ini(s.name)}</div>
      <div style="flex:1"><div class="staff-opt-name">${s.name}${isCur?' \u2713':''} ${hasConflict?'<span style="font-size:11px;color:#D85A30">⚠</span>':''}</div>
      <div class="staff-opt-sub">${subText}</div>${note||''}</div>
    </div>`;
  }

  // Categorise pod members
  const podFull=[],podPartial=[],podNone=[];
  pod.forEach(sid=>{
    const s=gsN(sid);if(!s)return;
    const av=getAvailSlots(sid);
    if(slots.every(sl=>av.includes(sl)))podFull.push({sid,score:overlap(sid,cid),usedOther:usedOther.has(sid)});
    else if(av.length>=4)podPartial.push({sid,av});
    else podNone.push({sid});
  });
  podFull.sort((a,b)=>a.usedOther!==b.usedOther?(a.usedOther?1:-1):b.score-a.score);

  // Non-pod staff with full or partial (≥1hr) availability and no conflict
  const npFull=[],npPartial=[];
  S.staff.forEach(s=>{
    if(podSet.has(s.id))return;
    const av=getAvailSlots(s.id);if(!av.length)return;
    const conflict=chkConflict(s.id,slots,cid,isTemp?-1:blockIdx,tempId||null);
    const coversAll=slots.every(sl=>av.includes(sl));
    if(coversAll&&!conflict.hasConflict)npFull.push({sid:s.id,av});
    else if(!coversAll&&av.length>=4&&!conflict.hasConflict)npPartial.push({sid:s.id,av});
  });

  // Show current split coverage at top of modal
  const splits=blk?.splits;
  let currentCoverageHtml='';
  if(splits&&splits.length){
    const blockSlots=blk.isTemp?blk.slots:slotsInBlock(blockFrom,blockTo);
    const coveredSlots=new Set();
    splits.forEach(sp=>slotsInBlock(sp.from,sp.to).forEach(sl=>{if(blockSlots.includes(sl))coveredSlots.add(sl);}));
    const uncoveredSlots=blockSlots.filter(sl=>!coveredSlots.has(sl));
    const uncoveredDesc=uncoveredSlots.length?`<div style="font-size:11px;color:#b87a00;font-weight:600;margin-top:6px;">⏱ Still uncovered: ${uncoveredSlots.length*15}m (${uncoveredSlots[0]} – ${slotEndDisplay(uncoveredSlots[uncoveredSlots.length-1],blockTo)})</div>`:'<div style="font-size:11px;color:#1D9E75;font-weight:600;margin-top:6px;">✅ Fully covered!</div>';
    currentCoverageHtml=`<div style="background:#E1F5EE;border:1px solid #5DCAA5;border-radius:8px;padding:10px 12px;margin-bottom:10px;">
      <div style="font-size:11px;font-weight:700;color:#085041;margin-bottom:6px;">Current coverage</div>
      ${splits.map(sp=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <div class="av av-s" style="width:22px;height:22px;font-size:8px">${ini(gsN(sp.sid)?.name||'?')}</div>
        <span style="font-size:12px;font-weight:500;flex:1">${gsN(sp.sid)?.name}</span>
        <span style="font-size:11px;color:#085041">${sp.from} – ${sp.to}</span>
        <button onclick="removeSplit('${cid}','${day}',${isTemp?-1:blockIdx},'${sp.sid}','${tempId||''}')" style="background:none;border:none;color:#D85A30;cursor:pointer;font-size:14px;padding:0 2px;">×</button>
      </div>`).join('')}
      ${uncoveredDesc}
      <button class="unassign-btn" style="margin-top:8px;" onclick="clearAllSplits('${cid}','${day}',${isTemp?-1:blockIdx},'${tempId||''}')">Clear all assignments</button>
    </div>`;
  }

  let html=currentCoverageHtml;

  // 1. Pod — full block
  if(podFull.length){
    html+='<div class="modal-section">✅ Pod — covers full block</div>';
    podFull.forEach(o=>{
      const cf=chkConflict(o.sid,slots,cid,isTemp?-1:blockIdx,tempId||null);
      let note='';
      if(cf.hasConflict){note=`<div style="font-size:10px;color:#D85A30;margin-top:2px;font-weight:500">⚠ Overlap: ${cf.conflicts.map(x=>x.name+' '+x.from+'-'+x.to).join(', ')}</div>`;}
      else if(o.usedOther){note=`<div style="font-size:10px;color:#888;margin-top:2px">Also on another block today</div>`;}
      html+=staffRow(o.sid,o.score+' overlap slots',o.sid===currentSid,cf.hasConflict,note);
    });
  }

  // 2. Pod — partial (≥1hr)
  if(podPartial.length){
    html+='<div class="modal-section">🕐 Pod — partially available</div>';
    podPartial.forEach(o=>{
      const contrib=getContribSlots(o.sid);
      if(!contrib.length)return;
      const alreadyAdded=splits&&splits.some(sp=>sp.sid===o.sid);
      const desc=alreadyAdded?'✓ Already added':descContrib(contrib)||'Partial';
      const note=alreadyAdded
        ?`<div style="font-size:10px;color:#1D9E75;margin-top:2px;font-weight:600">Already in coverage</div>`
        :`<div style="font-size:10px;color:#EF9F27;margin-top:2px">Doesn't cover full block</div>`;
      html+=staffRow(o.sid,desc,alreadyAdded,false,note,null,'partial');
    });
  }

  // 3. Pod — not available
  if(podNone.length){
    html+='<div class="modal-section">❌ Pod — not available</div>';
    podNone.forEach(o=>{const s=gsN(o.sid);html+=`<div class="staff-opt unavail"><div class="av av-s" style="width:28px;height:28px;font-size:10px">${ini(s.name)}</div><div><div class="staff-opt-name">${s.name}</div><div class="staff-opt-sub">No availability during this time</div></div></div>`;});
  }

  // 4. Non-pod — full, no conflict
  if(npFull.length){
    html+=`<div class="modal-section" style="margin-top:10px;">🔓 Not in pod — free for full block</div>`;
    html+=`<div style="font-size:10px;color:#888;margin-bottom:6px;padding:4px 8px;background:#FFF8EC;border-radius:6px;border:1px solid #FAC775;">Available with no conflicts. Go to Pods tab to add permanently.</div>`;
    npFull.forEach(o=>{
      const note=usedOther.has(o.sid)?`<div style="font-size:10px;color:#888;margin-top:2px">Also on another block today</div>`:'';
      html+=staffRow(o.sid,'Available — no conflicts',o.sid===currentSid,false,note,null,null);
    });
  }

  // 5. Non-pod — partial (≥1hr), no conflict
  if(npPartial.length){
    html+=`<div class="modal-section">🕐 Not in pod — partially free</div>`;
    html+=`<div style="font-size:10px;color:#888;margin-bottom:6px;padding:4px 8px;background:#FFF8EC;border-radius:6px;border:1px solid #FAC775;">Available for part of this block with no conflicts.</div>`;
    npPartial.forEach(o=>{
      const contrib=getContribSlots(o.sid);
      if(!contrib.length)return;
      const alreadyAdded=splits&&splits.some(sp=>sp.sid===o.sid);
      const desc=alreadyAdded?'✓ Already added':descContrib(contrib)||'Partial';
      const note=alreadyAdded
        ?`<div style="font-size:10px;color:#1D9E75;margin-top:2px;font-weight:600">Already in coverage</div>`
        :`<div style="font-size:10px;color:#EF9F27;margin-top:2px">Doesn't cover full block</div>`;
      html+=staffRow(o.sid,desc,alreadyAdded,false,note,null,'partial');
    });
  }

  if(!html)html='<div style="font-size:12px;color:#888;padding:.5rem 0">No staff available during this time.</div>';
  if(!blk?.splits&&(currentSid||isTemp))html+=`<button class="unassign-btn" onclick="doAssign('${cid}','${day}',${isTemp?-1:blockIdx},null,'${tempId||''}')">Remove assignment</button>`;
  if(isTemp)html+=`<button class="unassign-btn" style="color:#534AB7;border-color:#534AB7;margin-top:4px" onclick="deleteTempBlock('${tempId}')">Delete this temp block</button>`;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('assign-modal').classList.remove('hidden');
}

// Get the block object (regular or temp)
function getBlk(cid,day,blockIdx,tempId){
  if(tempId)return S.tempBlocks.find(t=>t.id===tempId)||null;
  return (gcN(cid)?.schedule[day]||[])[blockIdx]||null;
}

// Add or replace a staff member's coverage on a block for specific slots
function doAssign(cid,day,blockIdx,newSid,tempId){
  const blk=getBlk(cid,day,blockIdx,tempId);
  if(!blk)return;
  // Simple (non-split) assign — just set staffId and clear splits
  blk.staffId=newSid||null;
  blk.splits=null;
  markDirty();closeModal();render();
}

// Assign a staff member to cover only the uncovered slots they're available for
function doAssignPartial(cid,day,blockIdx,newSid,tempId){
  const blk=getBlk(cid,day,blockIdx,tempId);
  if(!blk)return;
  const blockSlots=blk.slots||slotsInBlock(blk.from,blk.to);
  // Find already covered slots from existing splits
  const coveredSlots=new Set();
  if(blk.splits){
    blk.splits.filter(sp=>sp.sid!==newSid).forEach(sp=>
      slotsInBlock(sp.from,sp.to).forEach(sl=>{if(blockSlots.includes(sl))coveredSlots.add(sl);})
    );
  } else if(blk.staffId&&blk.staffId!==newSid){
    const pav=new Set(gsN(blk.staffId)?.availability[day]||[]);
    blockSlots.forEach(sl=>{if(pav.has(sl))coveredSlots.add(sl);});
  }
  // Staff covers the uncovered slots they're available for
  const staffAvail=new Set(gsN(newSid)?.availability[day]||[]);
  const remaining=blockSlots.filter(sl=>!coveredSlots.has(sl));
  const coverSlots=(remaining.length?remaining:blockSlots).filter(sl=>staffAvail.has(sl));
  if(!coverSlots.length)return;
  // Convert to time range
  const from=coverSlots[0];
  const lastIdx=TIMES.indexOf(coverSlots[coverSlots.length-1]);
  const to=TIMES[lastIdx+1]||blk.to;
  // Build splits
  if(!blk.splits){
    // First split: existing staff covers their portion, new staff covers theirs
    blk.splits=[];
    if(blk.staffId){
      const existAv=new Set(gsN(blk.staffId)?.availability[day]||[]);
      const existSlots=blockSlots.filter(sl=>existAv.has(sl));
      if(existSlots.length){
        const ef=existSlots[0];
        const elIdx=TIMES.indexOf(existSlots[existSlots.length-1]);
        const et=TIMES[elIdx+1]||blk.to;
        blk.splits.push({sid:blk.staffId,from:ef,to:et});
      }
    }
  }
  // Remove existing entry for this staff, add updated one
  blk.splits=blk.splits.filter(sp=>sp.sid!==newSid);
  blk.splits.push({sid:newSid,from,to});
  blk.splits.sort((a,b)=>t2m(a.from)-t2m(b.from));
  blk.staffId=blk.splits[0].sid;
  markDirty();
  openAssignModal(cid,day,blockIdx,!!tempId,tempId);
  render();
}

function removeSplit(cid,day,blockIdx,sid,tempId){
  const blk=getBlk(cid,day,blockIdx,tempId);
  if(!blk)return;
  if(blk.splits){blk.splits=blk.splits.filter(sp=>sp.sid!==sid);if(!blk.splits.length)blk.splits=null;}
  blk.staffId=blk.splits?.[0]?.sid||null;
  markDirty();
  renderAssignModalBody(cid,day,blockIdx,tempId,blk);
  render();
}

function clearAllSplits(cid,day,blockIdx,tempId){
  const blk=getBlk(cid,day,blockIdx,tempId);
  if(!blk)return;
  blk.staffId=null;blk.splits=null;
  markDirty();closeModal();render();
}

// Render just the modal body (used when updating splits without closing modal)
function renderAssignModalBody(cid,day,blockIdx,tempId,blk){
  const existing=document.getElementById('modal-body');
  if(!existing)return;
  // Re-open the modal with updated state
  openAssignModal(cid,day,blockIdx,blk?.isTemp||!!tempId,tempId);
}
function deleteTempBlock(id){S.tempBlocks=S.tempBlocks.filter(t=>t.id!==id);markDirty();closeModal();render();}

function openTempModal(prefillDay){
  const dayOpts=DAYS.map(d=>`<option value="${d}"${d===(prefillDay||S.selectedDay||todayDay())?'selected':''}>${d}</option>`).join('');
  const clientOpts=S.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  const startOpts=TIMES.map(t=>`<option value="${t}">${t}</option>`).join('');
  const endOpts=TIMES.map(t=>`<option value="${t}">${t}</option>`).join('');
  document.getElementById('temp-body').innerHTML=`<div class="tb-row"><label>Client</label><select id="tb-client">${clientOpts}</select></div><div class="tb-row"><label>Day</label><select id="tb-day">${dayOpts}</select></div><div class="tb-row"><label>Start</label><select id="tb-start" onchange="syncTbEnd()">${startOpts}</select></div><div class="tb-row"><label>Finish</label><select id="tb-end">${endOpts}</select></div><div class="tb-row"><label>Label</label><input type="text" id="tb-label" placeholder="e.g. Doctor appt cover"></div><div style="margin-top:1rem;display:flex;gap:8px"><button class="btn btn-p" style="flex:1" onclick="createTempBlock()">Create block</button><button class="btn" onclick="closeTempModal()">Cancel</button></div><div style="font-size:11px;color:#888;margin-top:.75rem;line-height:1.6">The block will appear in Today and Weekly views. Click it to assign staff from the client's pod.</div>`;
  syncTbEnd();document.getElementById('temp-modal').classList.remove('hidden');
}
function closeTempModal(){document.getElementById('temp-modal').classList.add('hidden');}
function syncTbEnd(){const ss=document.getElementById('tb-start'),es=document.getElementById('tb-end');if(!ss||!es)return;const tgt=t2m(ss.value)+60;let best=TIMES[TIMES.length-1];TIMES.forEach(t=>{if(t2m(t)<=tgt)best=t;});es.value=best;}
function createTempBlock(){const cid=document.getElementById('tb-client').value;const day=document.getElementById('tb-day').value;const from=document.getElementById('tb-start').value;const to=document.getElementById('tb-end').value;const label=document.getElementById('tb-label').value.trim()||'Temp block';if(t2m(to)<=t2m(from)){showToast('Finish must be after start',true);return;}const slots=slotsInBlock(from,to);const id='tb'+Date.now();const pod=S.pods[cid]||[];let bestSid=null,bestScore=-1;pod.forEach(sid=>{if(S.calledOut.includes(sid))return;const s=gsN(sid);if(!s)return;const av=new Set(s.availability[day]||[]);if(!slots.every(sl=>av.has(sl)))return;const sc=overlap(sid,cid);if(sc>bestScore){bestScore=sc;bestSid=sid;}});S.tempBlocks.push({id,cid,day,slots,from,to,staffId:bestSid,label});markDirty();closeTempModal();render();showToast(bestSid?`Block created \u2014 assigned to ${gsN(bestSid)?.name}`:'Block created \u2014 tap it to assign staff',false);}

function addBlock(cid,day){const c=gcN(cid);if(!c)return;if(!c.schedule[day])c.schedule[day]=[];const existing=c.schedule[day];let defFrom='9:00 AM';if(existing.length){const last=existing[existing.length-1];const idx=TIMES.indexOf(last.to);defFrom=TIMES[Math.min(idx+1,TIMES.length-1)]||last.to;}const defToIdx=Math.min(TIMES.indexOf(defFrom)+4,TIMES.length-1);const defTo=TIMES[defToIdx]||defFrom;existing.push({from:defFrom,to:defTo,staffId:null});markDirty();render();}
function deleteBlock(cid,day,idx){const c=gcN(cid);if(!c)return;(c.schedule[day]||[]).splice(idx,1);if(!(c.schedule[day]||[]).length)delete c.schedule[day];markDirty();render();}
function updateBlockFrom(cid,day,idx,val){const blk=(gcN(cid)?.schedule[day]||[])[idx];if(!blk)return;blk.from=val;if(t2m(blk.to)<=t2m(val)){const ti=TIMES.indexOf(val);blk.to=TIMES[Math.min(ti+4,TIMES.length-1)]||val;}markDirty();render();}
function updateBlockTo(cid,day,idx,val){const blk=(gcN(cid)?.schedule[day]||[])[idx];if(!blk)return;blk.to=val;markDirty();render();}
function updateBlockStaff(cid,day,idx,sid){const blk=(gcN(cid)?.schedule[day]||[])[idx];if(!blk)return;blk.staffId=sid||null;markDirty();render();}
function toggleDay(cid,day){const c=gcN(cid);if(!c)return;if(c.schedule[day]){delete c.schedule[day];}else{c.schedule[day]=[];addBlock(cid,day);return;}markDirty();render();}

function tryLoad(){try{const r=localStorage.getItem(SK);if(r){const p=JSON.parse(r);S.clients=p.clients||S.clients;S.staff=p.staff||S.staff;S.pods=p.pods||S.pods;S.tempBlocks=p.tempBlocks||[];S.selClient=S.clients[0]?.id||null;S.selStaff=S.staff[0]?.id||null;S.lastSaved=p.savedAt||null;S.dirty=false;S.selDaysS=initSDS(S.staff);updSI();return true;}}catch(e){}return false;}
function doSave(silent){try{const d={clients:S.clients,staff:S.staff,pods:S.pods,tempBlocks:S.tempBlocks,savedAt:new Date().toISOString()};localStorage.setItem(SK,JSON.stringify(d));S.dirty=false;S.lastSaved=d.savedAt;updSI();if(!silent)showToast('Saved',false);}catch(e){showToast('Save failed',true);}}
function markDirty(){S.dirty=true;updSI();if(window._autoSaveTimer)clearTimeout(window._autoSaveTimer);window._autoSaveTimer=setTimeout(()=>{if(S.dirty){doSave(true);}},2000);}
function updSI(){const el=document.getElementById('si');if(!el)return;if(S.dirty){el.className='si unsaved';el.textContent='Saving...';}else if(S.lastSaved){el.className='si saved';el.textContent='Autosaved '+new Date(S.lastSaved).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}else{el.className='si';el.textContent='Not saved yet';}}
function showToast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.style.display='block';setTimeout(()=>t.style.display='none',2800);}
function exportJSON(){const d={clients:S.clients,staff:S.staff,pods:S.pods,tempBlocks:S.tempBlocks,exportedAt:new Date().toISOString()};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='ccaba-scheduling-backup.json';a.click();URL.revokeObjectURL(u);showToast('Backup downloaded',false);}
function importJSON(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(!p.clients||!p.staff)throw 0;S.clients=p.clients;S.staff=p.staff;S.pods=p.pods||{};S.tempBlocks=p.tempBlocks||[];S.selClient=S.clients[0]?.id||null;S.selStaff=S.staff[0]?.id||null;S.calledOut=[];S.selDaysS=initSDS(S.staff);markDirty();render();showToast('Imported',false);}catch(e){showToast('Invalid file',true);}};r.readAsText(f);};i.click();}
function resetData(){if(!confirm('Reset to sample data?'))return;const f=JSON.parse(JSON.stringify(DD));Object.assign(S,f);S.tempBlocks=[];S.selClient=S.clients[0]?.id;S.selStaff=S.staff[0]?.id;S.calledOut=[];S.dirty=true;S.selDaysS=initSDS(S.staff);try{localStorage.removeItem(SK);}catch(e){}render();showToast('Reset',false);}

function ini(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function gcN(id){return S.clients.find(c=>c.id===id);}
function gsN(id){return S.staff.find(s=>s.id===id);}
function overlap(sid,cid){const c=gcN(cid),s=gsN(sid);if(!c||!s)return 0;let o=0;DAYS.forEach(d=>{const cs=new Set((c.schedule[d]||[]).flatMap(blk=>slotsInBlock(blk.from,blk.to)));(s.availability[d]||[]).forEach(t=>{if(cs.has(t))o++;});});return o;}
function getStaffDaySlots(sid,day){const slots=new Set();S.clients.forEach(c=>{(c.schedule[day]||[]).forEach(blk=>{if(blk.staffId===sid)slotsInBlock(blk.from,blk.to).forEach(s=>slots.add(s));});});(S.tempBlocks||[]).forEach(tb=>{if(tb.staffId===sid&&tb.day===day)tb.slots.forEach(s=>slots.add(s));});return slots;}
function checkConflict(sid,day,newSlots,excludeCid,excludeBlockIdx,excludeTempId){const conflicts=[];const newSet=new Set(newSlots);S.clients.forEach(c=>{if(S.calledOutClients.includes(c.id))return;(c.schedule[day]||[]).forEach((blk,idx)=>{if(blk.staffId!==sid)return;if(c.id===excludeCid&&idx===excludeBlockIdx)return;const overlap=slotsInBlock(blk.from,blk.to).filter(s=>newSet.has(s));if(overlap.length>0)conflicts.push({name:c.name,from:blk.from,to:blk.to});});});(S.tempBlocks||[]).forEach(tb=>{if(tb.staffId!==sid||tb.day!==day)return;if(tb.id===excludeTempId)return;if(S.calledOutClients.includes(tb.cid))return;const overlap=tb.slots.filter(s=>newSet.has(s));if(overlap.length>0)conflicts.push({name:gcN(tb.cid)?.name||'?'+' (temp)',from:tb.from,to:tb.to});});return{hasConflict:conflicts.length>0,conflicts};}
function getConflictingStaffOnDay(day){const staffSlots={};S.clients.forEach(c=>{if(S.calledOutClients.includes(c.id))return;(c.schedule[day]||[]).forEach(blk=>{if(!blk.staffId)return;if(!staffSlots[blk.staffId])staffSlots[blk.staffId]=[];staffSlots[blk.staffId].push({slots:new Set(slotsInBlock(blk.from,blk.to)),from:blk.from,to:blk.to,name:c.name});});});(S.tempBlocks||[]).forEach(tb=>{if(!tb.staffId||tb.day!==day)return;if(S.calledOutClients.includes(tb.cid))return;if(!staffSlots[tb.staffId])staffSlots[tb.staffId]=[];staffSlots[tb.staffId].push({slots:new Set(tb.slots),from:tb.from,to:tb.to,name:(gcN(tb.cid)?.name||'?')+' (temp)'});});const conflicting=new Set();Object.entries(staffSlots).forEach(([sid,blocks])=>{for(let i=0;i<blocks.length;i++){for(let j=i+1;j<blocks.length;j++){const overlap=[...blocks[i].slots].some(s=>blocks[j].slots.has(s));if(overlap){conflicting.add(sid);break;}}}});return conflicting;}
function bestForSlot(cid,day,slot,excl){const pod=S.pods[cid]||[];const res=[];pod.forEach(sid=>{if(sid===excl||S.calledOut.includes(sid))return;const s=gsN(sid);if(!s)return;if((s.availability[day]||[]).includes(slot))res.push({sid,score:overlap(sid,cid)});});return res.sort((a,b)=>b.score-a.score);}
function todayDay(){const d=ALL_DAYS[new Date().getDay()];return DAYS.includes(d)?d:DAYS[0];}
function go(t){S.tab=t;document.querySelectorAll('.nav-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();}
function fmtBlock(blk){return blk.from+(blk.from!==blk.to?' \u2013 '+blk.to:'');}
function getDayBlocks(day){const out=[];S.clients.forEach(c=>{if(S.calledOutClients.includes(c.id))return;(c.schedule[day]||[]).forEach((blk,idx)=>{out.push({client:c,from:blk.from,to:blk.to,staffId:blk.staffId,splits:blk.splits||null,isTemp:false,blockIdx:idx});});});(S.tempBlocks||[]).filter(tb=>tb.day===day).forEach(tb=>{const c=gcN(tb.cid);if(!c||S.calledOutClients.includes(tb.cid))return;out.push({client:c,from:tb.from,to:tb.to,staffId:tb.staffId,splits:tb.splits||null,isTemp:true,tempId:tb.id,label:tb.label,slots:tb.slots});});out.sort((a,b)=>t2m(a.from)-t2m(b.from));return out;}

function getPartialGaps(bl,day){
  // Skip if no staff assigned at all
  if(!bl.staffId&&(!bl.splits||!bl.splits.length))return null;
  const blockFrom=bl.from, blockTo=bl.to;
  const allSlots=bl.isTemp?bl.slots:slotsInBlock(blockFrom,blockTo);
  if(!allSlots.length)return null;

  // Build set of covered slots — from splits if present, else from single staffId
  const coveredSlots=new Set();
  if(bl.splits&&bl.splits.length){
    bl.splits.forEach(sp=>{
      if(S.calledOut.includes(sp.sid))return;
      slotsInBlock(sp.from,sp.to).forEach(sl=>{if(allSlots.includes(sl))coveredSlots.add(sl);});
    });
  } else if(bl.staffId){
    const av=new Set(gsN(bl.staffId)?.availability[day]||[]);
    allSlots.forEach(sl=>{if(av.has(sl))coveredSlots.add(sl);});
  } else {
    return null; // no staff assigned
  }

  if(!bl.staffId&&(!bl.splits||!bl.splits.length))return null;
  const uncovered=allSlots.filter(sl=>!coveredSlots.has(sl));
  if(!uncovered.length)return null;

  function slotEnd(slotTime){
    const idx=TIMES.indexOf(slotTime);const next=TIMES[idx+1];
    return(next&&t2m(next)<=t2m(blockTo))?next:blockTo;
  }
  const ranges=[];let start=uncovered[0],prev=uncovered[0];
  for(let i=1;i<uncovered.length;i++){
    const prevIdx=TIMES.indexOf(prev),curIdx=TIMES.indexOf(uncovered[i]);
    if(curIdx===prevIdx+1){prev=uncovered[i];}
    else{ranges.push(start+' \u2013 '+slotEnd(prev));start=uncovered[i];prev=uncovered[i];}
  }
  ranges.push(start+' \u2013 '+slotEnd(prev));
  const mins=uncovered.length*15;
  const dur=mins>=60?Math.floor(mins/60)+'h'+(mins%60?' '+mins%60+'m':''):(mins+'m');
  return`${dur} uncovered: ${ranges.join(', ')}`;
}

function rToday(){
  if(!S.selectedDay)S.selectedDay=todayDay();
  const today=S.selectedDay;const realToday=todayDay();
  const blocks=getDayBlocks(today);
  const staffBanner=S.calledOut.length>0?`<div class="cob"><div class="cot">⚠ Staff called out</div><div style="display:flex;gap:5px;flex-wrap:wrap">${S.calledOut.map(sid=>{const s=gsN(sid);return`<span style="background:#F5C4B3;color:#4A1B0C;padding:2px 8px;border-radius:12px;font-size:11px">${s?s.name:'?'} <span onclick="rmCO('${sid}')" style="cursor:pointer;font-weight:700">×</span></span>`;}).join('')}</div></div>`:'';
  const clientBanner=S.calledOutClients.length>0?`<div class="cob" style="background:#F0F0FE;border-color:#AFA9EC;"><div class="cot" style="color:#3C3489;">📵 Clients cancelled — sessions removed</div><div style="display:flex;gap:5px;flex-wrap:wrap">${S.calledOutClients.map(cid=>{const c=gcN(cid);return`<span style="background:#EEEDFE;color:#3C3489;padding:2px 8px;border-radius:12px;font-size:11px">${c?c.name:'?'} <span onclick="rmClientCO('${cid}')" style="cursor:pointer;font-weight:700">×</span></span>`;}).join('')}</div></div>`:'';
  const cov=blocks.filter(b=>b.staffId&&!S.calledOut.includes(b.staffId)).length;
  const unc=blocks.filter(b=>!b.staffId||S.calledOut.includes(b.staffId)).length;
  const sh=blocks.length===0?`<div class="es">No sessions for ${today}${S.calledOutClients.length>0?' (some clients cancelled)':''}</div>`:blocks.map(bl=>{
    const co=bl.staffId&&S.calledOut.includes(bl.staffId);
    const todayConflicts=getConflictingStaffOnDay(today);
    const blConflict=bl.staffId&&todayConflicts.has(bl.staffId)&&!co;
    const gaps=getPartialGaps(bl,today);
    const bdr=co?'border-color:#F0997B;background:#FAECE7':blConflict?'border-color:#D85A30;background:#FAECE7':gaps?'border-color:#EF9F27;background:#FFF8EC':bl.isTemp?'border-color:#85B7EB;background:#E6F1FB':'';
    // Build staff chip — handle splits
    let chip;
    if(!bl.staffId){chip=`<span class="uc">Needs coverage</span>`;}
    else if(co){chip=`<span class="cc">&#9888; ${gsN(bl.staffId)?.name} (out)</span>`;}
    else if(blConflict){chip=`<span style="font-size:11px;padding:2px 8px;border-radius:20px;background:#FAECE7;color:#D85A30;font-weight:500">⚠ ${gsN(bl.staffId)?.name} (conflict)</span>`;}
    else if(bl.splits&&bl.splits.length>1){
      chip=`<div style="display:flex;flex-wrap:wrap;gap:3px;">${bl.splits.map(sp=>`<span class="sc2" style="font-size:10px;">${gsN(sp.sid)?.name} ${sp.from}\u2013${sp.to}</span>`).join('')}</div>`;
    } else {chip=`<span class="sc2">${gsN(bl.staffId)?.name}</span>`;}
    const gapTag=gaps?`<div style="font-size:10px;color:#b87a00;font-weight:600;margin-top:3px;">⏱ ${gaps}</div>`:'';
    const tempTag=bl.isTemp?`<span class="tc">Temp${bl.label?' \u2013 '+bl.label:''}</span>`:'';
    const bkey=regBlock('t_'+bl.client.id+'_'+today+'_'+bl.from.replace(/ /g,'')+(bl.isTemp?bl.tempId:bl.blockIdx),{cid:bl.client.id,day:today,blockIdx:bl.blockIdx??-1,isTemp:!!bl.isTemp,tempId:bl.tempId||null});
    return`<div class="ts${bl.isTemp?' tmp':''}" style="${bdr}" onclick="openBlock('${bkey}')">
      <div style="font-size:11px;color:#666;min-width:120px">${fmtBlock(bl)}</div>
      <div class="av av-c">${ini(bl.client.name)}</div>
      <div style="flex:1"><div style="font-size:12px;font-weight:500">${bl.client.name}</div>${tempTag?`<div style="margin-top:2px">${tempTag}</div>`:''}${gapTag}</div>
      ${chip}<div style="font-size:10px;color:#bbb;margin-left:4px">tap</div>
    </div>`;
  }).join('');
  return`<div style="width:100%"><div class="sidebar">
    <div class="ss"><div class="sl">Staff callout</div>
      <select id="co-sel" style="margin-bottom:6px"><option value="">Select staff...</option>${S.staff.map(s=>`<option value="${s.id}"${S.calledOut.includes(s.id)?' disabled':''}>${s.name}${S.calledOut.includes(s.id)?' (out)':''}</option>`).join('')}</select>
      <button class="btn btn-d" style="width:100%" onclick="mkCO()">Mark staff called out</button>
    </div>
    <div class="ss"><div class="sl">Client cancellation</div>
      <select id="client-co-sel" style="margin-bottom:6px"><option value="">Select client...</option>${S.clients.map(c=>`<option value="${c.id}"${S.calledOutClients.includes(c.id)?' disabled':''}>${c.name}${S.calledOutClients.includes(c.id)?' (cancelled)':''}</option>`).join('')}</select>
      <button class="btn" style="width:100%;background:#534AB7;color:#fff;border-color:#534AB7;" onclick="mkClientCO()">Mark client cancelled</button>
    </div>
    <div class="ss"><div class="sl">${today===realToday?'Today':'Day'} \u2014 ${today}</div>
      <div style="background:#E1F5EE;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#085041">Covered</div><div style="font-size:20px;font-weight:500;color:#085041">${cov}</div></div>
      <div style="background:#FAECE7;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#4A1B0C">Needs coverage</div><div style="font-size:20px;font-weight:500;color:#4A1B0C">${unc}</div></div>
      ${getConflictingStaffOnDay(today).size>0?`<div style="background:#FAECE7;border:1px solid #D85A30;border-radius:7px;padding:.625rem;margin-bottom:8px"><div style="font-size:10px;color:#D85A30;font-weight:500">⚠ Conflicts</div><div style="font-size:16px;font-weight:500;color:#D85A30">${getConflictingStaffOnDay(today).size} staff double-booked</div></div>`:''}
      <button class="btn btn-b" style="width:100%;margin-bottom:6px" onclick="openTempModal('${today}')">+ Add temp block</button>
      <button class="push-btn" style="width:100%;justify-content:center;border-radius:6px;padding:6px 12px" onclick="pushToPortal()">&#x1F4E4; Push to Staff Portal</button>
    </div>
    <div class="ss"><button class="btn btn-g" style="width:100%" onclick="doSave()">Save now</button></div>
  </div><div class="content">${staffBanner}${clientBanner}<div class="card"><div class="ch"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div class="ct">${today===realToday?"Today's Sessions":"Sessions"} \u2014 ${today}</div>${today!==realToday?'<span style="font-size:11px;background:#EEEDFE;color:#534AB7;padding:2px 8px;border-radius:10px">not today</span>':''}</div><div style="display:flex;gap:4px;flex-wrap:wrap">${DAYS.map(d=>`<button class="btn btn-sm" style="font-size:11px;${d===today?'background:#534AB7;color:#fff;border-color:#534AB7':d===realToday?'border-color:#534AB7;color:#534AB7':''}" onclick="S.selectedDay='${d}';render()">${d}</button>`).join('')}</div></div>${sh}</div></div></div>`;
}

function rWeek(){const byDay={};DAYS.forEach(d=>byDay[d]=getDayBlocks(d));const total=Object.values(byDay).reduce((s,a)=>s+a.length,0);const cov=Object.values(byDay).reduce((s,a)=>s+a.filter(x=>x.staffId&&!S.calledOut.includes(x.staffId)).length,0);const cols=DAYS.map(d=>{const blocks=byDay[d];const isToday=d===todayDay();const inner=blocks.length===0?`<div style="padding:8px;font-size:11px;color:#888">No sessions</div>`:blocks.map(bl=>{const co=bl.staffId&&S.calledOut.includes(bl.staffId);const dayConflicts=getConflictingStaffOnDay(d);const hasConflict=bl.staffId&&dayConflicts.has(bl.staffId)&&!co;const gaps=getPartialGaps(bl,d);const cls=bl.isTemp?'wtmp':co?'wco':hasConflict?'wconflict':gaps?'wpartial':bl.staffId?'wa':'wu';
let sname;
if(!bl.staffId){sname='Tap to assign';}
else if(co){sname=`\u26a0 ${gsN(bl.staffId)?.name} (out)`;}
else if(hasConflict){sname=`\u26a0 ${gsN(bl.staffId)?.name} (conflict)`;}
else if(bl.splits&&bl.splits.length>1){sname=bl.splits.map(sp=>`${gsN(sp.sid)?.name} ${sp.from}\u2013${sp.to}`).join(' | ');}
else{sname=gsN(bl.staffId)?.name||'?';}
const gapLine=gaps?`<div class="wsb-gap">\u23F1 ${gaps}</div>`:'';const bkey=regBlock('w_'+bl.client.id+'_'+d+'_'+bl.from.replace(/ /g,'')+(bl.isTemp?bl.tempId:bl.blockIdx),{cid:bl.client.id,day:d,blockIdx:bl.blockIdx??-1,isTemp:!!bl.isTemp,tempId:bl.tempId||null});const delBtn=bl.isTemp?`<button class="wsb-del" onclick="event.stopPropagation();deleteTempBlock('${bl.tempId}')" title="Delete block">\u2715</button>`:`<button class="wsb-del" onclick="event.stopPropagation();deleteBlock('${bl.client.id}','${d}',${bl.blockIdx})" title="Delete block">\u2715</button>`;return`<div class="wsl"><div class="wsb ${cls}" onclick="openBlock('${bkey}')"><div class="wsb-info"><div class="wsb-time">${fmtBlock(bl)}${bl.isTemp?' \u2022 TEMP':''}</div><div class="wsb-client">${bl.client.name}</div><div class="wsb-staff">${sname}</div>${gapLine}</div>${delBtn}</div></div>`;}).join('');return`<div class="wdc" style="${isToday?'border-color:#7F77DD':''}"><div class="wdh" style="${isToday?'background:#EEEDFE;color:#3C3489':''}"><span>${d}${isToday?' <span style="font-size:9px;background:#7F77DD;color:#fff;padding:1px 5px;border-radius:8px;margin-left:3px">Today</span>':''}</span><span style="font-size:9px;color:#888;margin-left:4px">${blocks.length}</span><button class="btn btn-sm" style="margin-left:auto;font-size:10px;background:#E6F1FB;color:#0C447C;border-color:#85B7EB" onclick="openTempModal('${d}')">+ Temp</button></div>${inner}</div>`;}).join('');
return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">This week</div><div style="background:#E6F1FB;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#042C53">Total</div><div style="font-size:20px;font-weight:500;color:#042C53">${total}</div></div><div style="background:#E1F5EE;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#085041">Covered</div><div style="font-size:20px;font-weight:500;color:#085041">${cov}</div></div><div style="background:#FAECE7;border-radius:7px;padding:.625rem"><div style="font-size:10px;color:#4A1B0C">Gaps</div><div style="font-size:20px;font-weight:500;color:#4A1B0C">${total-cov}</div></div></div><div class="ss" style="font-size:11px;color:#888;line-height:1.6">Click a block to reassign staff.<br>Click <strong>&#x2715;</strong> on a block to delete it.</div></div><div class="content"><div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem;font-size:10px;color:#777"><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#E1F5EE;display:inline-block"></span>Covered</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#FFF8EC;border:1px solid #EF9F27;display:inline-block"></span>Partial coverage</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#FAECE7;border:1px dashed #F0997B;display:inline-block"></span>Needs coverage</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#E6F1FB;border:1px dashed #85B7EB;display:inline-block"></span>Temp</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#F5C4B3;display:inline-block"></span>Called out</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#FAECE7;border:1px solid #D85A30;display:inline-block"></span>⚠ Conflict</span></div><div style="overflow-x:auto"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;min-width:600px">${cols}</div></div></div></div>`;}

function rClients(){const c=gcN(S.selClient);const pods=S.pods[S.selClient]||[];return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">Clients (${S.clients.length})</div><select style="margin-bottom:6px" onchange="selC(this.value)">${S.clients.map(cl=>`<option value="${cl.id}"${cl.id===S.selClient?'selected':''}>${cl.name}</option>`).join('')}</select><button class="add-btn" onclick="addC()">+ Add client</button></div></div><div class="content">${c?`<div class="card"><div class="ch"><div style="display:flex;align-items:center;gap:8px"><div class="av av-c" style="width:32px;height:32px;font-size:12px">${ini(c.name)}</div><div class="ct">${c.name}</div></div><button class="btn btn-d btn-sm" onclick="rmC('${c.id}')">Delete</button></div><div style="background:#E6F1FB;border:1px solid #85B7EB;border-radius:8px;padding:.75rem;margin-bottom:.875rem;font-size:12px;color:#042C53;line-height:1.6"><strong>How to set up the schedule:</strong> Click a day to activate it, then use <strong>+ Add block</strong> to add time blocks. Set the start and end time for each block and choose which staff member covers it. Add multiple blocks per day for split shifts.</div>${rBlockBuilder(c)}</div><div class="card"><div class="ch"><div class="ct">Pod members</div><span style="font-size:11px;color:#888">${pods.length} staff</span></div><p style="font-size:11px;color:#888;margin-bottom:.5rem">Click to add/remove (4\u20137 recommended)</p><div class="pg">${S.staff.map(s=>{const inp=pods.includes(s.id);const sc=overlap(s.id,c.id);return`<div class="pm ${inp?'ip':''}" onclick="togPod('${c.id}','${s.id}')"><div class="av av-s" style="width:22px;height:22px;font-size:8px">${ini(s.name)}</div><div><div style="font-size:11px;font-weight:500">${s.name}</div><div style="font-size:10px;color:#888">${sc} overlap</div></div>${inp?'<span style="color:#185FA5;margin-left:auto">\u2713</span>':''}</div>`;}).join('')}</div></div>`:'<div class="es">Select a client</div>'}</div></div>`;}

function rBlockBuilder(c){const activeDays=DAYS.filter(d=>c.schedule[d]);let html=`<div class="blk-builder"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem"><h4 style="font-size:11px;font-weight:500;color:#777;text-transform:uppercase;letter-spacing:.04em">Schedule by day</h4></div><div class="dr2" style="margin-bottom:1rem">`;DAYS.forEach(d=>{const on=activeDays.includes(d);html+=`<button class="dp${on?' on':''}" onclick="toggleDay('${c.id}','${d}')">${d}</button>`;});html+=`</div>`;if(activeDays.length===0){html+=`<div class="it">Click a day above to start building the schedule.</div></div>`;return html;}activeDays.forEach(d=>{const blocks=c.schedule[d]||[];html+=`<div class="blk-day-row"><div class="blk-day-label">${d}</div><div class="blk-list">`;blocks.forEach((blk,idx)=>{const fromOpts=TIMES.map(t=>`<option value="${t}"${t===blk.from?'selected':''}>${t}</option>`).join('');const toOpts=TIMES.map(t=>`<option value="${t}"${t===blk.to?'selected':''}>${t}</option>`).join('');const curStaffOpts=['<option value="">-- Unassigned --</option>'].concat((S.pods[c.id]||[]).map(sid=>{const s=gsN(sid);return s?`<option value="${sid}"${sid===blk.staffId?'selected':''}>${s.name}</option>`:'';})).join('');const hasStaff=!!blk.staffId;html+=`<div class="blk-item${hasStaff?' has-staff':' no-staff'}"><select style="width:100px;font-size:11px;padding:3px 5px" onchange="updateBlockFrom('${c.id}','${d}',${idx},this.value)">${fromOpts}</select><span style="font-size:11px;color:#888">to</span><select style="width:100px;font-size:11px;padding:3px 5px" onchange="updateBlockTo('${c.id}','${d}',${idx},this.value)">${toOpts}</select><select class="blk-staff-sel" style="font-size:11px;padding:3px 5px" onchange="updateBlockStaff('${c.id}','${d}',${idx},this.value)">${curStaffOpts}</select><button class="blk-del" onclick="deleteBlock('${c.id}','${d}',${idx})" title="Remove block">\u2715</button></div>`;});html+=`</div><button class="btn btn-sm" style="font-size:11px;color:#534AB7;border-color:#534AB7;background:#EEEDFE" onclick="addBlock('${c.id}','${d}')">+ Add block</button></div>`;});html+=`</div>`;return html;}

function rStaff(){const s=gsN(S.selStaff);const myC=Object.entries(S.pods).filter(([cid,pod])=>pod.includes(S.selStaff));return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">Staff (${S.staff.length})</div><select style="margin-bottom:6px" onchange="selS(this.value)">${S.staff.map(st=>{const out=S.calledOut.includes(st.id);return`<option value="${st.id}"${st.id===S.selStaff?'selected':''}>${st.name}${out?' (out)':''} \u2014 ${Object.entries(S.pods).filter(([,p])=>p.includes(st.id)).length} pods</option>`;}).join('')}</select><button class="add-btn" onclick="addS()">+ Add staff</button></div></div><div class="content">${s?`<div class="card"><div class="ch"><div style="display:flex;align-items:center;gap:8px"><div class="av av-s" style="width:32px;height:32px;font-size:12px">${ini(s.name)}</div><div><div class="ct">${s.name}</div><div style="font-size:11px;color:#888">${myC.length} client pods</div></div></div><div style="display:flex;gap:5px">${S.calledOut.includes(s.id)?`<button class="btn btn-sm" onclick="rmCO('${s.id}')">Mark available</button>`:`<button class="btn btn-d btn-sm" onclick="mkOut('${s.id}')">Call out</button>`}<button class="btn btn-d btn-sm" onclick="rmS('${s.id}')">Delete</button></div></div><div class="sx">${rAG(s)}</div></div><div class="card"><div class="ch"><div class="ct">Client pods</div></div>${myC.length===0?`<div style="font-size:12px;color:#888">Not in any pods yet</div>`:myC.map(([cid])=>{const cl=gcN(cid);if(!cl)return'';return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid rgba(0,0,0,.1)"><div class="av av-c" style="width:22px;height:22px;font-size:8px">${ini(cl.name)}</div><span style="font-size:12px;flex:1">${cl.name}</span><span style="font-size:10px;color:#888">${overlap(s.id,cid)} overlap</span></div>`;}).join('')}</div>`:'<div class="es">Select a staff member</div>'}</div></div>`;}

function rPods(){
  const view=S.podView||'clients';
  const toggleBtns=`<div style="display:flex;gap:6px;margin-bottom:1.25rem"><button class="btn${view==='clients'?' btn-p':''}" onclick="S.podView='clients';render()">Client pods</button><button class="btn${view==='staff'?' btn-p':''}" onclick="S.podView='staff';render()">Staff pods</button></div>`;
  if(view==='clients'){
    if(!S.selPodClient&&S.clients.length)S.selPodClient=S.clients[0].id;
    const pod=S.pods[S.selPodClient]||[];
    const clientOpts=S.clients.map(cl=>`<option value="${cl.id}"${cl.id===S.selPodClient?'selected':''}>${cl.name}</option>`).join('');
    const podHtml=pod.length===0?`<div style="font-size:12px;color:#888;padding:.5rem 0">No staff in this pod yet.</div>`:pod.map(sid=>{const st=gsN(sid);if(!st)return'';const out=S.calledOut.includes(sid);const sc=overlap(sid,S.selPodClient);return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid rgba(0,0,0,.08)"><div class="av av-s" style="width:28px;height:28px">${ini(st.name)}</div><div style="flex:1"><div style="font-size:13px;font-weight:500">${st.name}</div><div style="font-size:11px;color:#888">${sc} overlap${out?' \u00b7 <span style="color:#E24B4A">out today</span>':''}</div></div><button class="btn btn-d btn-sm" onclick="removePodMember('${S.selPodClient}','${sid}')">Remove</button></div>`;}).join('');
    const ok=pod.length>=4&&pod.length<=7;
    const notInPod=S.staff.filter(s=>!pod.includes(s.id));
    const candidatesHtml=notInPod.length===0?`<div style="font-size:12px;color:#888;padding:.5rem 0">All staff are already in this pod.</div>`:notInPod.map(s=>{const sc=overlap(s.id,S.selPodClient);const out=S.calledOut.includes(s.id);const myPodCount=Object.entries(S.pods).filter(([,p])=>p.includes(s.id)).length;const availDays=DAYS.filter(d=>(s.availability[d]||[]).length>0);const availSummary=availDays.length?availDays.map(d=>{const sl=s.availability[d];return d+' '+sl[0]+'2013'+availEnd(sl);}).join(', '):'No availability set';return`<div style="display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid rgba(0,0,0,.1);border-radius:8px;margin-bottom:6px;background:#fafaf9"><div class="av av-s" style="width:30px;height:30px;flex-shrink:0">${ini(s.name)}</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:13px;font-weight:500">${s.name}</span>${out?'<span style="font-size:10px;color:#E24B4A">called out today</span>':''}<span style="font-size:10px;color:#888">\u00b7 ${myPodCount} pod${myPodCount!==1?'s':''} currently</span><span style="font-size:10px;color:#0F6E56;background:#E1F5EE;padding:1px 6px;border-radius:8px">${sc} overlap slots</span></div><div style="font-size:11px;color:#888;margin-top:2px;line-height:1.4">${availSummary}</div></div><button class="btn btn-p btn-sm" style="flex-shrink:0" onclick="addPodMemberDirect('${S.selPodClient}','${s.id}')">+ Add</button></div>`;}).join('');
    const allPodsHtml=S.clients.map(cl=>{const p=S.pods[cl.id]||[];const pok=p.length>=4&&p.length<=7;const isSelected=cl.id===S.selPodClient;const clSchedDays=DAYS.filter(d=>(cl.schedule[d]||[]).length>0);const clSchedStr=clSchedDays.length?clSchedDays.map(d=>{const blocks=cl.schedule[d];return d+' '+blocks[0].from+'\u2013'+blocks[blocks.length-1].to;}).join(' \u00b7 '):'No schedule set';return`<div class="card" style="margin:0;cursor:pointer;${isSelected?'border-color:#534AB7;outline:2px solid #EEEDFE;':''}" onclick="S.selPodClient='${cl.id}';render()"><div style="display:flex;align-items:center;gap:7px;margin-bottom:4px"><div class="av av-c" style="width:26px;height:26px">${ini(cl.name)}</div><div style="flex:1"><div style="font-size:12px;font-weight:500">${cl.name}</div><div style="font-size:10px;color:#888">${p.length} staff</div></div><span style="font-size:10px;padding:2px 6px;border-radius:8px;background:${pok?'#C0DD97':'#F5C4B3'};color:${pok?'#173404':'#4A1B0C'}">${pok?'Good':''+p.length}</span></div><div style="font-size:10px;color:#888;margin-bottom:6px;padding-bottom:6px;border-bottom:0.5px solid rgba(0,0,0,.08);line-height:1.5">${clSchedStr}</div>${p.map(sid=>{const st=gsN(sid);const out=S.calledOut.includes(sid);if(!st)return'';const availDays=DAYS.filter(d=>(st.availability[d]||[]).length>0);const availStr=availDays.length?availDays.join(','):'no avail';return`<div style="padding:3px 0;font-size:11px;border-top:0.5px solid rgba(0,0,0,.05)"><div style="display:flex;align-items:center;gap:5px"><div class="av av-s" style="width:16px;height:16px;font-size:7px">${ini(st.name)}</div><span style="flex:1">${st.name}</span>${out?'<span style="color:#E24B4A;font-size:9px">out</span>':''}</div><div style="font-size:9px;color:#999;margin-left:21px">${availStr}</div></div>`;}).join('')}</div>`;}).join('');
    return`<div style="width:100%;flex-direction:column" class="content">${toggleBtns}<h3 style="font-size:13px;font-weight:500;color:#888;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.04em">All client pods \u2014 click to manage</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.75rem;margin-bottom:1.5rem">${allPodsHtml}</div><div class="card" style="max-width:640px"><div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.875rem;flex-wrap:wrap"><div class="ct">Manage pod:</div><select style="flex:1;max-width:200px" onchange="S.selPodClient=this.value;render()">${clientOpts}</select><span style="font-size:11px;padding:3px 10px;border-radius:10px;background:${ok?'#C0DD97':'#F5C4B3'};color:${ok?'#173404':'#4A1B0C'}">${ok?'\u2713 Good':'\u26a0 '+pod.length+' (aim 4\u20137)'}</span></div>${podHtml}</div><div class="card" style="max-width:640px"><div class="ch"><div class="ct">Add a staff member</div></div><p style="font-size:11px;color:#888;margin-bottom:.625rem">See their schedule overlap and current pod load before adding</p>${candidatesHtml}</div></div>`;
  }
  if(!S.selPodStaff&&S.staff.length)S.selPodStaff=S.staff[0].id;
  const myClients=Object.entries(S.pods).filter(([cid,pod])=>pod.includes(S.selPodStaff));
  const staffOpts=S.staff.map(st=>`<option value="${st.id}"${st.id===S.selPodStaff?'selected':''}>${st.name}</option>`).join('');
  const podsHtml=myClients.length===0?`<div style="font-size:12px;color:#888;padding:.5rem 0">Not in any client pods yet.</div>`:myClients.map(([cid])=>{const c=gcN(cid);if(!c)return'';const sc=overlap(S.selPodStaff,cid);const pod=S.pods[cid]||[];return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid rgba(0,0,0,.08)"><div class="av av-c" style="width:28px;height:28px">${ini(c.name)}</div><div style="flex:1"><div style="font-size:13px;font-weight:500">${c.name}</div><div style="font-size:11px;color:#888">${sc} overlap \u00b7 ${pod.length} in pod</div></div><button class="btn btn-d btn-sm" onclick="removePodMember('${cid}','${S.selPodStaff}')">Remove</button></div>`;}).join('');
  const notInFor=S.clients.filter(c=>!(S.pods[c.id]||[]).includes(S.selPodStaff));
  const candidatesHtml2=notInFor.length===0?`<div style="font-size:12px;color:#888;padding:.5rem 0">Already in every client's pod.</div>`:notInFor.map(c=>{const sc=overlap(S.selPodStaff,c.id);const podSize=(S.pods[c.id]||[]).length;const podOk=podSize>=4&&podSize<=7;const schedDays=DAYS.filter(d=>(c.schedule[d]||[]).length>0);const schedSummary=schedDays.length?schedDays.map(d=>{const blocks=c.schedule[d];const first=blocks[0],last=blocks[blocks.length-1];return d+' '+first.from+'\u2013'+last.to;}).join(', '):'No schedule set';return`<div style="display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid rgba(0,0,0,.1);border-radius:8px;margin-bottom:6px;background:#fafaf9"><div class="av av-c" style="width:30px;height:30px;flex-shrink:0">${ini(c.name)}</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:13px;font-weight:500">${c.name}</span><span style="font-size:10px;padding:1px 6px;border-radius:8px;background:${podOk?'#C0DD97':'#F5C4B3'};color:${podOk?'#173404':'#4A1B0C'}">${podSize} in pod</span><span style="font-size:10px;color:#0F6E56;background:#E1F5EE;padding:1px 6px;border-radius:8px">${sc} overlap slots</span></div><div style="font-size:11px;color:#888;margin-top:2px;line-height:1.4">${schedSummary}</div></div><button class="btn btn-p btn-sm" style="flex-shrink:0" onclick="addStaffToPodDirect('${S.selPodStaff}','${c.id}')">+ Add</button></div>`;}).join('');
  const allStaffHtml=S.staff.map(st=>{const myC=Object.entries(S.pods).filter(([cid,pod])=>pod.includes(st.id));const out=S.calledOut.includes(st.id);const isSelected=st.id===S.selPodStaff;const stAvailDays=DAYS.filter(d=>(st.availability[d]||[]).length>0);const stAvailStr=stAvailDays.length?stAvailDays.map(d=>{const sl=st.availability[d];return d+' '+sl[0]+'2013'+availEnd(sl);}).join(' \u00b7 '):'No availability set';return`<div class="card" style="margin:0;cursor:pointer;${isSelected?'border-color:#534AB7;outline:2px solid #EEEDFE;':''}" onclick="S.selPodStaff='${st.id}';render()"><div style="display:flex;align-items:center;gap:7px;margin-bottom:4px"><div class="av av-s" style="width:26px;height:26px">${ini(st.name)}</div><div style="flex:1"><div style="font-size:12px;font-weight:500">${st.name}${out?' <span style="color:#E24B4A;font-size:10px">(out)</span>':''}</div><div style="font-size:10px;color:#888">${myC.length} client${myC.length!==1?'s':''}</div></div></div><div style="font-size:10px;color:#888;margin-bottom:6px;padding-bottom:6px;border-bottom:0.5px solid rgba(0,0,0,.08);line-height:1.5">${stAvailStr}</div>${myC.map(([cid])=>{const c=gcN(cid);if(!c)return'';const schedDays=DAYS.filter(d=>(c.schedule[d]||[]).length>0);const schedStr=schedDays.length?schedDays.join(','):'no sched';const podSize=(S.pods[cid]||[]).length;return`<div style="padding:3px 0;font-size:11px;border-top:0.5px solid rgba(0,0,0,.05)"><div style="display:flex;align-items:center;gap:5px"><div class="av av-c" style="width:16px;height:16px;font-size:7px">${ini(c.name)}</div><span style="flex:1">${c.name}</span><span style="font-size:9px;color:#999">${podSize}/pod</span></div><div style="font-size:9px;color:#999;margin-left:21px">${schedStr}</div></div>`;}).join('')}</div>`;}).join('');
  return`<div style="width:100%;flex-direction:column" class="content">${toggleBtns}<h3 style="font-size:13px;font-weight:500;color:#888;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.04em">All staff pods \u2014 click to manage</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.75rem;margin-bottom:1.5rem">${allStaffHtml}</div><div class="card" style="max-width:640px"><div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.875rem;flex-wrap:wrap"><div class="ct">Manage pods for:</div><select style="flex:1;max-width:200px" onchange="S.selPodStaff=this.value;render()">${staffOpts}</select><span style="font-size:11px;color:#888">${myClients.length} client pod${myClients.length!==1?'s':''}</span></div>${podsHtml}</div><div class="card" style="max-width:640px"><div class="ch"><div class="ct">Add to a client's pod</div></div><p style="font-size:11px;color:#888;margin-bottom:.625rem">See pod size and schedule overlap before adding</p>${candidatesHtml2}</div></div>`;
}

x;font-weight:500">${st?.name}</div><div style="font-size:10px;color:#888">${opt.score} overlap</div></div></div><div style="display:flex;align-items:center;gap:6px"><span class="${tier}">${lbl}</span><button class="btn btn-p btn-sm" onclick="doAssign('${a.cid}','${a.day}',${a.blockIdx},'${opt.sid}','${a.tempId||''}');render()">Assign</button></div></div>`;}).join('')}</div>`;}).join('')}</div>`}</div></div>`;
  }
