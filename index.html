<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri'];
const ALL_DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function bT(){const o=[];for(let h=8;h<=17;h++){for(let m=0;m<60;m+=15){if(h===17&&m>0)break;const ap=h<12?'AM':'PM';const h12=h===0?12:h>12?h-12:h;o.push(`${h12}:${m===0?'00':m} ${ap}`);}}return o;}
const TIMES=bT();
function t2m(t){const[ti,ap]=t.split(' ');const[h,m]=ti.split(':').map(Number);let hr=h;if(ap==='PM'&&h!==12)hr=h+12;if(ap==='AM'&&h===12)hr=0;return hr*60+m;}
const SK='podscheduler_v3';

const DD={
  clients:[
    {id:'c1',name:'Margaret T.',schedule:{Mon:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM'],Wed:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM'],Fri:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM']}},
    {id:'c2',name:'David R.',schedule:{Tue:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM','11:15 AM','11:30 AM','11:45 AM','12:00 PM'],Thu:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM']}},
    {id:'c3',name:'Linda K.',schedule:{Mon:['1:00 PM','1:15 PM','1:30 PM','1:45 PM','2:00 PM'],Wed:['1:00 PM','1:15 PM','1:30 PM','1:45 PM','2:00 PM','2:15 PM','2:30 PM','2:45 PM','3:00 PM']}},
    {id:'c4',name:'James B.',schedule:{Mon:['9:00 AM','9:15 AM','9:30 AM'],Tue:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM'],Thu:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM']}},
    {id:'c5',name:'Sandra W.',schedule:{Wed:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM'],Fri:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM','11:15 AM','11:30 AM','11:45 AM','12:00 PM']}},
  ],
  staff:[
    {id:'s1',name:'Alex M.',availability:{Mon:['8:00 AM','8:15 AM','8:30 AM','8:45 AM','9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM'],Tue:['9:00 AM','9:15 AM','9:30 AM','10:00 AM'],Wed:['9:00 AM','9:15 AM','9:30 AM','9:45 AM'],Fri:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM']}},
    {id:'s2',name:'Jordan P.',availability:{Mon:['1:00 PM','1:15 PM','1:30 PM','1:45 PM','2:00 PM','2:15 PM','2:30 PM','2:45 PM','3:00 PM'],Tue:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM','11:15 AM','11:30 AM','11:45 AM','12:00 PM'],Wed:['1:00 PM','1:15 PM','1:30 PM','1:45 PM','2:00 PM','2:15 PM','2:30 PM','2:45 PM','3:00 PM'],Thu:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM']}},
    {id:'s3',name:'Taylor B.',availability:{Mon:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','1:00 PM','1:15 PM','1:30 PM','1:45 PM','2:00 PM'],Wed:['10:00 AM','10:15 AM','1:00 PM','1:15 PM','1:30 PM','1:45 PM','2:00 PM','2:15 PM','2:30 PM','2:45 PM','3:00 PM'],Fri:['2:00 PM','2:15 PM','2:30 PM','2:45 PM','3:00 PM','3:15 PM','3:30 PM','3:45 PM','4:00 PM']}},
    {id:'s4',name:'Morgan L.',availability:{Tue:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM'],Thu:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM'],Fri:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM','11:15 AM','11:30 AM','11:45 AM','12:00 PM']}},
    {id:'s5',name:'Riley C.',availability:{Mon:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM'],Wed:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM'],Thu:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM'],Fri:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM']}},
    {id:'s6',name:'Casey N.',availability:{Mon:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM'],Tue:['9:00 AM','9:15 AM'],Wed:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM']}},
  ],
  pods:{c1:['s1','s3','s5','s6'],c2:['s2','s4','s6'],c3:['s2','s3'],c4:['s1','s4','s6'],c5:['s1','s3','s5']},
  assignments:{
    c1:{Mon:{'9:00 AM':'s1','9:15 AM':'s1','9:30 AM':'s1','9:45 AM':'s1','10:00 AM':'s1','10:15 AM':'s1','10:30 AM':'s1','10:45 AM':'s1','11:00 AM':'s1'},Wed:{'9:00 AM':'s3','9:15 AM':'s3','9:30 AM':'s3','9:45 AM':'s3','10:00 AM':'s3'},Fri:{'9:00 AM':'s1','9:15 AM':'s1','9:30 AM':'s1','9:45 AM':'s1','10:00 AM':'s1'}},
    c2:{Tue:{'10:00 AM':'s2','10:15 AM':'s2','10:30 AM':'s2','10:45 AM':'s2','11:00 AM':'s2'},Thu:{'10:00 AM':'s4','10:15 AM':'s4','10:30 AM':'s4','10:45 AM':'s4','11:00 AM':'s4'}},
    c3:{Mon:{'1:00 PM':'s3','1:15 PM':'s3','1:30 PM':'s3','1:45 PM':'s3','2:00 PM':'s3'},Wed:{'1:00 PM':'s2','1:15 PM':'s2','1:30 PM':'s2','1:45 PM':'s2','2:00 PM':'s2'}},
    c4:{Mon:{'9:00 AM':'s1','9:15 AM':'s1','9:30 AM':'s1'},Tue:{'9:00 AM':'s4','9:15 AM':'s4','9:30 AM':'s4','9:45 AM':'s4','10:00 AM':'s4'},Thu:{'9:00 AM':'s4','9:15 AM':'s4','9:30 AM':'s4','9:45 AM':'s4','10:00 AM':'s4'}},
    c5:{Wed:{'10:00 AM':'s5','10:15 AM':'s5','10:30 AM':'s5','10:45 AM':'s5','11:00 AM':'s5'},Fri:{'10:00 AM':'s5','10:15 AM':'s5','10:30 AM':'s5','10:45 AM':'s5','11:00 AM':'s5'}},
  }
};

function initSD(cl){const sd={};cl.forEach(c=>{sd[c.id]=new Set(Object.keys(c.schedule).filter(d=>DAYS.includes(d)));});return sd;}
function initSDS(st){const sd={};st.forEach(s=>{sd[s.id]=new Set(Object.keys(s.availability).filter(d=>DAYS.includes(d)));});return sd;}

let S={tab:'today',...JSON.parse(JSON.stringify(DD)),selClient:'c1',selStaff:'s1',calloutStaff:null,calledOut:[],edTab:'clients',expEdit:null,rStart:null,rDay:null,rEid:null,rType:null,dirty:false,lastSaved:null};
S.selDaysC=initSD(S.clients);
S.selDaysS=initSDS(S.staff);

function tryLoad(){
  try{const r=localStorage.getItem(SK);if(r){const p=JSON.parse(r);S.clients=p.clients||S.clients;S.staff=p.staff||S.staff;S.pods=p.pods||S.pods;S.assignments=p.assignments||S.assignments;S.selClient=S.clients[0]?.id||null;S.selStaff=S.staff[0]?.id||null;S.lastSaved=p.savedAt||null;S.dirty=false;S.selDaysC=initSD(S.clients);S.selDaysS=initSDS(S.staff);updSI();return true;}}catch(e){}return false;
}
function doSave(){
  try{const d={clients:S.clients,staff:S.staff,pods:S.pods,assignments:S.assignments,savedAt:new Date().toISOString()};localStorage.setItem(SK,JSON.stringify(d));S.dirty=false;S.lastSaved=d.savedAt;updSI();showToast('Saved',false);}
  catch(e){showToast('Save failed',true);}
}
function markDirty(){S.dirty=true;updSI();}
function updSI(){const el=document.getElementById('si');if(!el)return;if(S.dirty){el.className='si unsaved';el.textContent='Unsaved changes';}else if(S.lastSaved){el.className='si saved';el.textContent='Saved '+new Date(S.lastSaved).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}else{el.className='si';el.textContent='Not saved yet';}}
function showToast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function exportJSON(){const d={clients:S.clients,staff:S.staff,pods:S.pods,assignments:S.assignments,exportedAt:new Date().toISOString()};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='podscheduler-backup.json';a.click();URL.revokeObjectURL(u);showToast('Backup downloaded',false);}
function importJSON(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(!p.clients||!p.staff)throw 0;S.clients=p.clients;S.staff=p.staff;S.pods=p.pods||{};S.assignments=p.assignments||{};S.selClient=S.clients[0]?.id||null;S.selStaff=S.staff[0]?.id||null;S.calledOut=[];S.selDaysC=initSD(S.clients);S.selDaysS=initSDS(S.staff);markDirty();render();showToast('Imported',false);}catch(e){showToast('Invalid file',true);}};r.readAsText(f);};i.click();}
function resetData(){if(!confirm('Reset to sample data? All your changes will be lost.'))return;const f=JSON.parse(JSON.stringify(DD));Object.assign(S,f);S.selClient=S.clients[0]?.id;S.selStaff=S.staff[0]?.id;S.calledOut=[];S.dirty=true;S.selDaysC=initSD(S.clients);S.selDaysS=initSDS(S.staff);try{localStorage.removeItem(SK);}catch(e){}render();showToast('Reset to sample data',false);}

function ini(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function gcN(id){return S.clients.find(c=>c.id===id);}
function gsN(id){return S.staff.find(s=>s.id===id);}
function overlap(sid,cid){const c=gcN(cid),s=gsN(sid);if(!c||!s)return 0;let o=0;DAYS.forEach(d=>{const cs=new Set(c.schedule[d]||[]);(s.availability[d]||[]).forEach(t=>{if(cs.has(t))o++;});});return o;}
function bestFor(cid,day,slot,excl){const pod=S.pods[cid]||[];const res=[];pod.forEach(sid=>{if(sid===excl||S.calledOut.includes(sid))return;const s=gsN(sid);if(!s)return;if((s.availability[day]||[]).includes(slot))res.push({sid,score:overlap(sid,cid)});});return res.sort((a,b)=>b.score-a.score);}
function gA(cid,day,slot){return S.assignments[cid]?.[day]?.[slot]||null;}
function sA(cid,day,slot,sid){if(!S.assignments[cid])S.assignments[cid]={};if(!S.assignments[cid][day])S.assignments[cid][day]={};S.assignments[cid][day][slot]=sid;}
function dA(cid,day,slot){if(S.assignments[cid]?.[day])delete S.assignments[cid][day][slot];}
function todayDay(){const d=ALL_DAYS[new Date().getDay()];return DAYS.includes(d)?d:DAYS[0];}
function go(t){S.tab=t;S.rStart=null;document.querySelectorAll('.nav-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();}
function fmtR(slots){if(!slots||!slots.length)return'';const s=[...slots].sort((a,b)=>t2m(a)-t2m(b));return s[0]+(s.length>1?' - '+s[s.length-1]:'');}

function rToday(){
  const today=todayDay();const slots=[];
  S.clients.forEach(c=>{const ds=(c.schedule[today]||[]).slice().sort((a,b)=>t2m(a)-t2m(b));if(!ds.length)return;const groups=[];let cur=null;ds.forEach(t=>{const sid=gA(c.id,today,t);if(!cur||cur.sid!==sid){cur={from:t,to:t,sid};groups.push(cur);}else cur.to=t;});groups.forEach(g=>slots.push({client:c,from:g.from,to:g.to,sid:g.sid}));});
  slots.sort((a,b)=>t2m(a.from)-t2m(b.from));
  const banner=S.calledOut.length>0?`<div class="cob"><div class="cot">Called out today</div><div style="display:flex;gap:5px;flex-wrap:wrap">${S.calledOut.map(sid=>{const s=gsN(sid);return`<span style="background:#F5C4B3;color:#4A1B0C;padding:2px 8px;border-radius:12px;font-size:11px">${s?s.name:'?'} <span onclick="rmCO('${sid}')" style="cursor:pointer">x</span></span>`;}).join('')}</div></div>`:'';
  const cov=slots.filter(s=>s.sid&&!S.calledOut.includes(s.sid)).length;
  const unc=slots.filter(s=>!s.sid||S.calledOut.includes(s.sid)).length;
  const sh=slots.length===0?`<div class="es">No sessions scheduled for ${today}</div>`
    :slots.map(sl=>{const co=sl.sid&&S.calledOut.includes(sl.sid);const bdr=co?'border-color:#F0997B;background:#FAECE7':'';
      const chip=sl.sid?(co?`<span class="cc">&#9888; ${gsN(sl.sid)?.name} (out)</span>`:`<span class="sc2">${gsN(sl.sid)?.name}</span>`):`<span class="uc">Needs coverage</span>`;
      const btn=co?`<button class="btn btn-p btn-sm" onclick="goCO2('${sl.client.id}')">Find cover</button>`:`<button class="btn btn-sm" onclick="qA('${sl.client.id}','${today}')">Reassign</button>`;
      return`<div class="ts" style="${bdr}"><div style="font-size:11px;color:#666;min-width:110px">${sl.from}${sl.from!==sl.to?' - '+sl.to:''}</div><div class="av av-c">${ini(sl.client.name)}</div><div style="font-size:12px;font-weight:500;flex:1">${sl.client.name}</div>${chip}${btn}</div>`;}).join('');
  return`<div style="width:100%"><div class="sidebar">
    <div class="ss"><div class="sl">Quick callout</div>
      <select id="co-sel" style="margin-bottom:6px"><option value="">Select staff...</option>${S.staff.map(s=>`<option value="${s.id}"${S.calledOut.includes(s.id)?' disabled':''}>${s.name}${S.calledOut.includes(s.id)?' (out)':''}</option>`).join('')}</select>
      <button class="btn btn-d" style="width:100%" onclick="mkCO()">Mark called out</button></div>
    <div class="ss"><div class="sl">Today — ${today}</div>
      <div style="background:#E1F5EE;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#085041">Covered</div><div style="font-size:20px;font-weight:500;color:#085041">${cov}</div></div>
      <div style="background:#FAECE7;border-radius:7px;padding:.625rem"><div style="font-size:10px;color:#4A1B0C">Needs coverage</div><div style="font-size:20px;font-weight:500;color:#4A1B0C">${unc}</div></div></div>
    <div class="ss"><button class="btn btn-g" style="width:100%" onclick="doSave()">Save now</button></div>
  </div><div class="content">${banner}<div class="card"><div class="ch"><div class="ct">Today's Sessions — ${today}</div></div>${sh}</div></div></div>`;
}

function rWeek(){
  const byDay={};DAYS.forEach(d=>byDay[d]=[]);
  S.clients.forEach(c=>{DAYS.forEach(d=>{const ds=(c.schedule[d]||[]).slice().sort((a,b)=>t2m(a)-t2m(b));if(!ds.length)return;const groups=[];let cur=null;ds.forEach(t=>{const sid=gA(c.id,d,t);const co=sid&&S.calledOut.includes(sid);if(!cur||cur.sid!==sid){cur={from:t,to:t,sid,co};groups.push(cur);}else cur.to=t;});groups.forEach(g=>byDay[d].push({client:c,from:g.from,to:g.to,sid:g.sid,co:g.co}));});});
  DAYS.forEach(d=>byDay[d].sort((a,b)=>t2m(a.from)-t2m(b.from)));
  const total=Object.values(byDay).reduce((s,a)=>s+a.length,0);
  const cov=Object.values(byDay).reduce((s,a)=>s+a.filter(x=>x.sid&&!x.co).length,0);
  const cols=DAYS.map(d=>{const ss2=byDay[d];const isToday=d===todayDay();
    const inner=ss2.length===0?`<div style="padding:8px;font-size:11px;color:#888">No sessions</div>`
      :ss2.map(sl=>{const cls=sl.co?'wco':sl.sid?'wa':'wu';const sname=sl.sid?(sl.co?`&#9888; ${gsN(sl.sid)?.name} (out)`:gsN(sl.sid)?.name):'Needs coverage';
        return`<div class="wsl"><div style="font-size:10px;color:#888;margin-bottom:3px">${sl.from}${sl.from!==sl.to?' - '+sl.to:''}</div><div class="wse ${cls}"><div class="av av-c" style="width:18px;height:18px;font-size:7px">${ini(sl.client.name)}</div><div><div style="font-size:10px;font-weight:500">${sl.client.name}</div><div style="font-size:9px;opacity:.8">${sname}</div></div></div></div>`;}).join('');
    return`<div class="wdc" style="${isToday?'border-color:#7F77DD':''}"><div class="wdh" style="${isToday?'background:#EEEDFE;color:#3C3489':''}">${d}${isToday?' <span style="font-size:9px;background:#7F77DD;color:#fff;padding:1px 5px;border-radius:8px;margin-left:3px">Today</span>':''} <span style="font-size:9px;color:#888">${ss2.length}</span></div>${inner}</div>`;}).join('');
  return`<div style="width:100%"><div class="sidebar">
    <div class="ss"><div class="sl">This week</div>
      <div style="background:#E6F1FB;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#042C53">Total sessions</div><div style="font-size:20px;font-weight:500;color:#042C53">${total}</div></div>
      <div style="background:#E1F5EE;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#085041">Covered</div><div style="font-size:20px;font-weight:500;color:#085041">${cov}</div></div>
      <div style="background:#FAECE7;border-radius:7px;padding:.625rem"><div style="font-size:10px;color:#4A1B0C">Gaps</div><div style="font-size:20px;font-weight:500;color:#4A1B0C">${total-cov}</div></div></div>
  </div><div class="content">
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem;font-size:10px;color:#777">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#9FE1CB;display:inline-block"></span>Covered</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#FAECE7;border:1px solid #F0997B;display:inline-block"></span>Needs coverage</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#F5C4B3;display:inline-block"></span>Called out</span>
    </div>
    <div style="overflow-x:auto"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;min-width:550px">${cols}</div></div>
  </div></div>`;
}

function rClients(){
  const c=gcN(S.selClient);const pods=S.pods[S.selClient]||[];
  return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">Clients (${S.clients.length})</div>
    ${S.clients.map(cl=>`<div class="si2 ${cl.id===S.selClient?'sel':''}" onclick="selC('${cl.id}')"><div class="av av-c">${ini(cl.name)}</div><span class="nm">${cl.name}</span><span class="bx">${(S.pods[cl.id]||[]).length}</span></div>`).join('')}
    <button class="add-btn" onclick="addC()">+ Add client</button></div>
  </div><div class="content">${c?`
    <div class="card"><div class="ch"><div style="display:flex;align-items:center;gap:8px"><div class="av av-c" style="width:32px;height:32px;font-size:12px">${ini(c.name)}</div><div class="ct">${c.name}</div></div><button class="btn btn-d btn-sm" onclick="rmC('${c.id}')">Delete</button></div>
      <div class="lg"><div class="li"><div class="ld" style="background:#9FE1CB"></div>Assigned</div><div class="li"><div class="ld" style="background:#E1F5EE"></div>Scheduled</div></div>
      <div class="sx">${rSG(c)}</div></div>
    <div class="card"><div class="ch"><div class="ct">Pod members</div><span style="font-size:11px;color:#888">${pods.length} staff</span></div>
      <p style="font-size:11px;color:#888;margin-bottom:.5rem">Click to add/remove (4–7 recommended)</p>
      <div class="pg">${S.staff.map(s=>{const inp=pods.includes(s.id);const sc=overlap(s.id,c.id);return`<div class="pm ${inp?'ip':''}" onclick="togPod('${c.id}','${s.id}')"><div class="av av-s" style="width:22px;height:22px;font-size:8px">${ini(s.name)}</div><div><div style="font-size:11px;font-weight:500">${s.name}</div><div style="font-size:10px;color:#888">${sc} overlap</div></div>${inp?'<span style="color:#185FA5;margin-left:auto">&#10003;</span>':''}</div>`;}).join('')}</div>
    </div>
  `:'<div class="es">Select a client</div>'}</div></div>`;
}

function rStaff(){
  const s=gsN(S.selStaff);const myC=Object.entries(S.pods).filter(([cid,pod])=>pod.includes(S.selStaff));
  return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">Staff (${S.staff.length})</div>
    ${S.staff.map(st=>{const out=S.calledOut.includes(st.id);return`<div class="si2 ${st.id===S.selStaff?'sel':''}" onclick="selS('${st.id}')"><div class="av av-s">${ini(st.name)}</div><span class="nm">${st.name}</span>${out?'<span class="dr"></span>':''}<span class="bx">${Object.entries(S.pods).filter(([,p])=>p.includes(st.id)).length}</span></div>`;}).join('')}
    <button class="add-btn" onclick="addS()">+ Add staff</button></div>
  </div><div class="content">${s?`
    <div class="card"><div class="ch"><div style="display:flex;align-items:center;gap:8px"><div class="av av-s" style="width:32px;height:32px;font-size:12px">${ini(s.name)}</div><div><div class="ct">${s.name}</div><div style="font-size:11px;color:#888">${myC.length} client pods</div></div></div>
      <div style="display:flex;gap:5px">${S.calledOut.includes(s.id)?`<button class="btn btn-sm" onclick="rmCO('${s.id}')">Mark available</button>`:`<button class="btn btn-d btn-sm" onclick="mkOut('${s.id}')">Call out</button>`}<button class="btn btn-d btn-sm" onclick="rmS('${s.id}')">Delete</button></div></div>
      <div class="sx">${rAG(s)}</div></div>
    <div class="card"><div class="ch"><div class="ct">Client pods</div></div>
      ${myC.length===0?`<div style="font-size:12px;color:#888">Not in any pods yet</div>`
        :myC.map(([cid])=>{const cl=gcN(cid);if(!cl)return'';return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid rgba(0,0,0,.1)"><div class="av av-c" style="width:22px;height:22px;font-size:8px">${ini(cl.name)}</div><span style="font-size:12px;flex:1">${cl.name}</span><span style="font-size:10px;color:#888">${overlap(s.id,cid)} overlap</span></div>`;}).join('')}
    </div>
  `:'<div class="es">Select a staff member</div>'}</div></div>`;
}

function rPods(){
  return`<div style="width:100%;flex-direction:column" class="content"><h2 style="font-size:15px;font-weight:500;margin-bottom:1rem">All pods overview</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.875rem">
    ${S.clients.map(c=>{const pod=S.pods[c.id]||[];const ok=pod.length>=4&&pod.length<=7;
      return`<div class="card" style="margin:0"><div style="display:flex;align-items:center;gap:7px;margin-bottom:8px"><div class="av av-c" style="width:28px;height:28px">${ini(c.name)}</div><div><div style="font-size:12px;font-weight:500">${c.name}</div><div style="font-size:10px;color:#888">${pod.length} staff</div></div><span style="margin-left:auto;font-size:10px;padding:2px 7px;border-radius:8px;background:${ok?'#C0DD97':'#F5C4B3'};color:${ok?'#173404':'#4A1B0C'}">${ok?'Good':'Check: '+pod.length}</span></div>
        ${pod.map(sid=>{const st=gsN(sid);const out=S.calledOut.includes(sid);return st?`<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:0.5px solid rgba(0,0,0,.1)"><div class="av av-s" style="width:20px;height:20px;font-size:8px">${ini(st.name)}</div><span style="font-size:11px;flex:1">${st.name}</span>${out?'<span class="dr"></span>':''}<span style="font-size:10px;color:#888">${overlap(sid,c.id)}</span></div>`:'';}).join('')}
      </div>`;}).join('')}
    </div></div>`;

function rCallout(){
  const aff=[];
  if(S.calloutStaff){Object.entries(S.assignments).forEach(([cid,days])=>{Object.entries(days).forEach(([day,slots])=>{Object.entries(slots).forEach(([slot,sid])=>{if(sid===S.calloutStaff){const best=bestFor(cid,day,slot,S.calloutStaff);aff.push({cid,day,slot,best});}});});});}
  const grouped={};aff.forEach(a=>{const k=a.cid+'_'+a.day;if(!grouped[k])grouped[k]={cid:a.cid,day:a.day,slots:[],best:a.best};grouped[k].slots.push(a.slot);});
  const groups=Object.values(grouped);
  return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">Select staff</div>
    ${S.staff.map(s=>{const out=S.calledOut.includes(s.id);return`<div class="si2 ${S.calloutStaff===s.id?'sel':''}" onclick="selCO('${s.id}')"><div class="av av-s">${ini(s.name)}</div><span class="nm">${s.name}</span>${out?'<span class="bx" style="background:#F5C4B3;color:#4A1B0C">Out</span>':''}</div>`;}).join('')}
  </div></div><div class="content">${!S.calloutStaff?`<div class="es">Select a staff member to see coverage options</div>`:`
    <div class="cob"><div class="cot">&#9888; Coverage needed: ${gsN(S.calloutStaff)?.name}</div>
      <div style="display:flex;gap:6px">${S.calledOut.includes(S.calloutStaff)?`<button class="btn btn-sm" onclick="rmCO('${S.calloutStaff}')">Mark available</button>`:`<button class="btn btn-d btn-sm" onclick="mkOut('${S.calloutStaff}')">Mark called out today</button>`}</div></div>
    <div class="card"><div class="ch"><div class="ct">Affected sessions & coverage</div></div>
      ${groups.length===0?`<div style="font-size:12px;color:#888">No assigned sessions found.</div>`
        :groups.map(g=>{const c=gcN(g.cid);const range=fmtR(g.slots);
          return`<div style="padding:8px 0;border-bottom:0.5px solid rgba(0,0,0,.1)"><div style="display:flex;align-items:center;gap:7px;margin-bottom:6px"><div class="av av-c" style="width:22px;height:22px;font-size:8px">${ini(c?.name||'?')}</div><strong style="font-size:12px">${c?.name} — ${g.day} ${range}</strong></div>
            ${g.best.length===0?`<div style="font-size:11px;color:#D85A30">No pod members available for this slot</div>`
              :g.best.slice(0,3).map((opt,i)=>{const st=gsN(opt.sid);const tier=i===0?'mg':i===1?'mo':'mp';const lbl=i===0?'Best match':i===1?'Good':'Available';
                return`<div class="co2"><div style="display:flex;align-items:center;gap:7px"><div class="av av-s" style="width:22px;height:22px;font-size:8px">${ini(st?.name||'?')}</div><div><div style="font-size:12px;font-weight:500">${st?.name}</div><div style="font-size:10px;color:#888">${opt.score} overlap slots</div></div></div>
                  <div style="display:flex;align-items:center;gap:6px"><span class="${tier}">${lbl}</span><button class="btn btn-p btn-sm" onclick="doRG('${g.cid}','${g.day}','${S.calloutStaff}','${opt.sid}')">Assign</button></div></div>`;}).join('')}
          </div>`;}).join('')}
    </div>
  `}</div></div>`;
}

  return`<div style="width:100%"><div class="sidebar">
    <div class="ss"><div class="sl">What to edit</div>
      <div class="si2 ${S.edTab==='clients'?'sel':''}" onclick="setET('clients')">Clients &amp; schedules</div>

function rEC(){
  let h=`<div class="card"><div class="ch"><div class="ct">Clients</div><button class="btn btn-p btn-sm" onclick="addC()">+ Add client</button></div>`;
  S.clients.forEach(c=>{
    const exp=S.expEdit===c.id;const selDays=S.selDaysC[c.id]||new Set();const activeDays=DAYS.filter(d=>selDays.has(d));const totalSlots=activeDays.reduce((n,d)=>n+(c.schedule[d]||[]).length,0);const isR=S.rType==='client'&&S.rEid===c.id;
    h+=`<div style="border-bottom:0.5px solid rgba(0,0,0,.1);padding:10px 0"><div style="display:flex;align-items:center;gap:8px"><input class="ie" value="${c.name}" onblur="rnC('${c.id}',this.value)"><span style="font-size:11px;color:#888;white-space:nowrap">${activeDays.join(', ')||'No days'} &middot; ${totalSlots} slots</span><button class="btn btn-sm" onclick="togExp('${c.id}')">${exp?'Hide':'Edit schedule'}</button><button class="btn btn-d btn-sm" onclick="rmC('${c.id}')">Del</button></div>`;
    if(exp){
      h+=`<div class="exs"><h4>Select days</h4><div class="dr2">`;DAYS.forEach(d=>{const on=selDays.has(d);h+=`<button class="dp${on?' on':''}" onclick="togCD('${c.id}','${d}')">${d}</button>`;});h+=`</div>`;
      if(activeDays.length>0){
        h+=isR&&S.rStart?`<div class="rh">Range started at <strong>${S.rStart}</strong> on <strong>${S.rDay}</strong> — click an end time to fill all slots between</div>`:`<div class="it">Click a time to start a range, click another to fill all 15-min slots between them.</div>`;
        activeDays.forEach(d=>{const sel=new Set(c.schedule[d]||[]);const allOn=TIMES.every(t=>sel.has(t));h+=`<div class="hb"><div class="hbh"><span class="hbd">${d}</span><span class="hbc">${sel.size} slots selected</span><span class="slnk" onclick="${allOn?`clrCD('${c.id}','${d}')`:` saCD('${c.id}','${d}')`}">${allOn?'Clear all':'Select all'}</span></div><div class="hg">`;TIMES.forEach(t=>{const on=sel.has(t);const isS=isR&&S.rStart===t&&S.rDay===d;h+=`<button class="hc${on?' on':''}${isS?' rp':''}" onclick="clkCT('${c.id}','${d}','${t}')">${t}</button>`;});h+=`</div></div>`;});
      }else{h+=`<div class="it" style="margin-top:.5rem">Click a day above to start adding times.</div>`;}
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  return h+'</div>';
}

function rES(){
  let h=`<div class="card"><div class="ch"><div class="ct">Staff</div><button class="btn btn-p btn-sm" onclick="addS()">+ Add staff</button></div>`;
  S.staff.forEach(s=>{
    const exp=S.expEdit===s.id;const selDays=S.selDaysS[s.id]||new Set();const activeDays=DAYS.filter(d=>selDays.has(d));const totalSlots=activeDays.reduce((n,d)=>n+(s.availability[d]||[]).length,0);const isR=S.rType==='staff'&&S.rEid===s.id;
    h+=`<div style="border-bottom:0.5px solid rgba(0,0,0,.1);padding:10px 0"><div style="display:flex;align-items:center;gap:8px"><input class="ie" value="${s.name}" onblur="rnS('${s.id}',this.value)"><span style="font-size:11px;color:#888;white-space:nowrap">${activeDays.join(', ')||'No days'} &middot; ${totalSlots} slots</span><button class="btn btn-sm" onclick="togExp('${s.id}')">${exp?'Hide':'Edit availability'}</button><button class="btn btn-d btn-sm" onclick="rmS('${s.id}')">Del</button></div>`;
    if(exp){
      h+=`<div class="exs"><h4>Select days</h4><div class="dr2">`;DAYS.forEach(d=>{const on=selDays.has(d);h+=`<button class="dp${on?' on':''}" onclick="togSD('${s.id}','${d}')">${d}</button>`;});h+=`</div>`;
      if(activeDays.length>0){
        h+=isR&&S.rStart?`<div class="rh">Range started at <strong>${S.rStart}</strong> on <strong>${S.rDay}</strong> — click an end time to fill all slots between</div>`:`<div class="it">Click a time to start a range, click another to fill all 15-min slots between them.</div>`;
        activeDays.forEach(d=>{const sel=new Set(s.availability[d]||[]);const allOn=TIMES.every(t=>sel.has(t));h+=`<div class="hb"><div class="hbh"><span class="hbd">${d}</span><span class="hbc">${sel.size} slots selected</span><span class="slnk" onclick="${allOn?`clrSD('${s.id}','${d}')`:` saSD('${s.id}','${d}')`}">${allOn?'Clear all':'Select all'}</span></div><div class="hg">`;TIMES.forEach(t=>{const on=sel.has(t);const isS=isR&&S.rStart===t&&S.rDay===d;h+=`<button class="hc${on?' on':''}${isS?' rp':''}" onclick="clkST('${s.id}','${d}','${t}')">${t}</button>`;});h+=`</div></div>`;});
      }else{h+=`<div class="it" style="margin-top:.5rem">Click a day above to start adding times.</div>`;}
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  return h+'</div>';
}

function rSave(){
  const hs=!!S.lastSaved;const sd=S.lastSaved?new Date(S.lastSaved).toLocaleString():null;
  return`<div style="width:100%;flex-direction:column" class="content">
    <h2 style="font-size:15px;font-weight:500;margin-bottom:1.25rem">Save &amp; Load</h2>
    <div class="sp"><h3>Browser storage</h3>
      <div style="font-size:12px;color:#888;margin-bottom:.75rem;line-height:1.6">Saves your data in this browser. Persists between sessions as long as you use the same browser and don't clear your cache.${hs?`<br><span style="color:#1D9E75">Last saved: ${sd}</span>`:''}${S.dirty?`<br><span style="color:#EF9F27">You have unsaved changes</span>`:''}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-g" onclick="doSave()">Save now</button>${hs?`<button class="btn" onclick="ldSt()">Reload saved data</button>`:''}</div></div>
    <div class="sp"><h3>Download backup file</h3>
      <div style="font-size:12px;color:#888;margin-bottom:.75rem;line-height:1.6">Downloads a <code style="background:#f0f0ee;padding:1px 4px;border-radius:3px;font-size:11px">.json</code> file to your computer. Save it to Google Drive or your desktop. Use it to restore your data or move it to another device.</div>
      <button class="btn btn-p" onclick="exportJSON()">Download .json backup</button></div>
    <div class="sp"><h3>Load from backup file</h3>
      <div style="font-size:12px;color:#888;margin-bottom:.75rem;line-height:1.6">Restore from a previously downloaded backup. This will replace your current data.</div>
      <button class="btn" onclick="importJSON()">Load from .json file</button></div>
    <div class="sp" style="border-color:#F0997B"><h3>Reset to sample data</h3>
      <div style="font-size:12px;color:#888;margin-bottom:.75rem;line-height:1.6">Wipes everything and restores the original sample clients and staff. Cannot be undone unless you have a backup file.</div>
      <button class="btn btn-d" onclick="resetData()">Reset to sample data</button></div>
  </div>`;
}

function rSG(c){let h=`<div class="sgrid" style="grid-template-columns:72px repeat(5,1fr)"><div></div>`;DAYS.forEach(d=>{h+=`<div class="dh">${d}</div>`;});TIMES.forEach(t=>{const isH=t.endsWith(':00 AM')||t.endsWith(':00 PM');h+=`<div class="tl">${isH?t:''}</div>`;DAYS.forEach(d=>{const sch=(c.schedule[d]||[]).includes(t);const asgn=gA(c.id,d,t);let cls='';if(asgn)cls='assigned';else if(sch)cls='sched';h+=`<div class="sc ${cls||'empty'}" onclick="togCS('${c.id}','${d}','${t}')" title="${d} ${t}${asgn?' — '+gsN(asgn)?.name:''}"></div>`;});});return h+'</div>';}
function rAG(s){let h=`<div class="sgrid" style="grid-template-columns:72px repeat(5,1fr)"><div></div>`;DAYS.forEach(d=>{h+=`<div class="dh">${d}</div>`;});TIMES.forEach(t=>{const isH=t.endsWith(':00 AM')||t.endsWith(':00 PM');h+=`<div class="tl">${isH?t:''}</div>`;DAYS.forEach(d=>{const av=(s.availability[d]||[]).includes(t);h+=`<div class="sc ${av?'avail':'empty'}" onclick="togSS('${s.id}','${d}','${t}')"></div>`;});});return h+'</div>';}

function selC(id){S.selClient=id;render();}
function selS(id){S.selStaff=id;render();}
function selCO(id){S.calloutStaff=id;render();}
function setET(t){S.edTab=t;S.expEdit=null;S.rStart=null;render();}
function togExp(id){S.expEdit=S.expEdit===id?null:id;if(S.expEdit!==id)S.rStart=null;render();}
function togPod(cid,sid){if(!S.pods[cid])S.pods[cid]=[];const i=S.pods[cid].indexOf(sid);if(i>=0)S.pods[cid].splice(i,1);else S.pods[cid].push(sid);markDirty();render();}
function togCS(cid,day,slot){const c=gcN(cid);if(!c)return;if(!c.schedule[day])c.schedule[day]=[];const i=c.schedule[day].indexOf(slot);if(i>=0){c.schedule[day].splice(i,1);dA(cid,day,slot);}else{c.schedule[day].push(slot);const b=bestFor(cid,day,slot,null);if(b.length>0)sA(cid,day,slot,b[0].sid);}markDirty();render();}
function togSS(sid,day,slot){const s=gsN(sid);if(!s)return;if(!s.availability[day])s.availability[day]=[];const i=s.availability[day].indexOf(slot);if(i>=0)s.availability[day].splice(i,1);else s.availability[day].push(slot);markDirty();render();}
function togCD(cid,day){const c=gcN(cid);if(!c)return;if(!S.selDaysC[cid])S.selDaysC[cid]=new Set();const sel=S.selDaysC[cid];if(sel.has(day)){sel.delete(day);delete c.schedule[day];}else{sel.add(day);if(!c.schedule[day])c.schedule[day]=[];}if(S.rEid===cid){S.rStart=null;S.rDay=null;S.rType=null;S.rEid=null;}markDirty();render();}
function togSD(sid,day){const s=gsN(sid);if(!s)return;if(!S.selDaysS[sid])S.selDaysS[sid]=new Set();const sel=S.selDaysS[sid];if(sel.has(day)){sel.delete(day);delete s.availability[day];}else{sel.add(day);if(!s.availability[day])s.availability[day]=[];}if(S.rEid===sid){S.rStart=null;S.rDay=null;S.rType=null;S.rEid=null;}markDirty();render();}
function clkCT(cid,day,time){const c=gcN(cid);if(!c)return;if(!c.schedule[day])c.schedule[day]=[];if(S.rType==='client'&&S.rEid===cid&&S.rStart&&S.rDay===day){const lo=Math.min(t2m(S.rStart),t2m(time));const hi=Math.max(t2m(S.rStart),t2m(time));const inR=TIMES.filter(t=>t2m(t)>=lo&&t2m(t)<=hi);const sel=new Set(c.schedule[day]);inR.forEach(t=>sel.add(t));c.schedule[day]=[...sel];S.rStart=null;S.rDay=null;S.rType=null;S.rEid=null;markDirty();render();}else if(S.rType==='client'&&S.rEid===cid&&S.rStart===time&&S.rDay===day){const sel=new Set(c.schedule[day]);if(sel.has(time))sel.delete(time);else sel.add(time);c.schedule[day]=[...sel];S.rStart=null;S.rDay=null;S.rType=null;S.rEid=null;markDirty();render();}else{S.rStart=time;S.rDay=day;S.rType='client';S.rEid=cid;render();}}
function clkST(sid,day,time){const s=gsN(sid);if(!s)return;if(!s.availability[day])s.availability[day]=[];if(S.rType==='staff'&&S.rEid===sid&&S.rStart&&S.rDay===day){const lo=Math.min(t2m(S.rStart),t2m(time));const hi=Math.max(t2m(S.rStart),t2m(time));const inR=TIMES.filter(t=>t2m(t)>=lo&&t2m(t)<=hi);const sel=new Set(s.availability[day]);inR.forEach(t=>sel.add(t));s.availability[day]=[...sel];S.rStart=null;S.rDay=null;S.rType=null;S.rEid=null;markDirty();render();}else if(S.rType==='staff'&&S.rEid===sid&&S.rStart===time&&S.rDay===day){const sel=new Set(s.availability[day]);if(sel.has(time))sel.delete(time);else sel.add(time);s.availability[day]=[...sel];S.rStart=null;S.rDay=null;S.rType=null;S.rEid=null;markDirty();render();}else{S.rStart=time;S.rDay=day;S.rType='staff';S.rEid=sid;render();}}
function saCD(cid,day){const c=gcN(cid);if(!c)return;c.schedule[day]=[...TIMES];markDirty();render();}
function clrCD(cid,day){const c=gcN(cid);if(!c)return;c.schedule[day]=[];markDirty();render();}
function saSD(sid,day){const s=gsN(sid);if(!s)return;s.availability[day]=[...TIMES];markDirty();render();}
function clrSD(sid,day){const s=gsN(sid);if(!s)return;s.availability[day]=[];markDirty();render();}
function rnC(id,val){if(val.trim()){const c=gcN(id);if(c)c.name=val.trim();markDirty();render();}}
function rnS(id,val){if(val.trim()){const s=gsN(id);if(s)s.name=val.trim();markDirty();render();}}
function mkCO(){const sel=document.getElementById('co-sel');if(!sel?.value)return;const sid=sel.value;if(!S.calledOut.includes(sid))S.calledOut.push(sid);render();}
function mkOut(sid){if(!S.calledOut.includes(sid))S.calledOut.push(sid);render();}
function rmCO(sid){S.calledOut=S.calledOut.filter(s=>s!==sid);render();}
function goCO2(cid){const co=S.calledOut[0];if(co)S.calloutStaff=co;go('callout');}
function qA(cid,day){const c=gcN(cid);if(!c)return;(c.schedule[day]||[]).forEach(slot=>{if(!gA(cid,day,slot)){const b=bestFor(cid,day,slot,null);if(b.length>0)sA(cid,day,slot,b[0].sid);}});markDirty();render();}
function doRG(cid,day,oldSid,newSid){const c=gcN(cid);if(!c)return;(c.schedule[day]||[]).forEach(slot=>{if(gA(cid,day,slot)===oldSid){sA(cid,day,slot,newSid);Object.entries(S.assignments).forEach(([oc,days])=>{if(oc===cid)return;if(days[day]&&days[day][slot]===newSid)delete days[day][slot];});}});markDirty();render();}
function addC(){const name=prompt('New client name:');if(!name?.trim())return;const id='c'+Date.now();S.clients.push({id,name:name.trim(),schedule:{}});S.pods[id]=[];S.selDaysC[id]=new Set();S.selClient=id;markDirty();render();}
function addS(){const name=prompt('New staff name:');if(!name?.trim())return;const id='s'+Date.now();S.staff.push({id,name:name.trim(),availability:{}});S.selDaysS[id]=new Set();S.selStaff=id;markDirty();render();}
function rmC(id){if(!confirm('Remove this client?'))return;S.clients=S.clients.filter(c=>c.id!==id);delete S.pods[id];delete S.assignments[id];delete S.selDaysC[id];S.selClient=S.clients[0]?.id||null;markDirty();render();}
function rmS(id){if(!confirm('Remove this staff member?'))return;S.staff=S.staff.filter(s=>s.id!==id);Object.keys(S.pods).forEach(cid=>{S.pods[cid]=S.pods[cid].filter(s=>s!==id);});Object.values(S.assignments).forEach(days=>{Object.values(days).forEach(slots=>{Object.keys(slots).forEach(sl=>{if(slots[sl]===id)delete slots[sl];});});});S.calledOut=S.calledOut.filter(s=>s!==id);delete S.selDaysS[id];S.selStaff=S.staff[0]?.id||null;markDirty();render();}
function ldSt(){const ok=tryLoad();if(ok){render();showToast('Data loaded',false);}else showToast('No saved data found',true);}

function render(){
  const mc=document.getElementById('mc');if(!mc)return;
  const block=['pods','data','save'];mc.style.display=block.includes(S.tab)?'block':'flex';
  if(S.tab==='today')mc.innerHTML=rToday();
  else if(S.tab==='week')mc.innerHTML=rWeek();
  else if(S.tab==='clients')mc.innerHTML=rClients();
  else if(S.tab==='staff')mc.innerHTML=rStaff();
  else if(S.tab==='pods')mc.innerHTML=rPods();
  else if(S.tab==='callout')mc.innerHTML=rCallout();
  else if(S.tab==='data')mc.innerHTML=rData();
  else if(S.tab==='save')mc.innerHTML=rSave();
  updSI();
}

tryLoad();
render();
</script>
</body>
</html>
