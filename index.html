<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PodScheduler</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#f5f5f3;color:#1a1a18;font-size:14px;}
.app{display:flex;flex-direction:column;min-height:100vh;}
.nav{background:#fff;border-bottom:0.5px solid rgba(0,0,0,.15);padding:0 1.25rem;display:flex;align-items:center;height:48px;overflow-x:auto;}
.nav-brand{font-size:14px;font-weight:500;margin-right:1.5rem;white-space:nowrap;}
.nav-tab{padding:0 .75rem;height:48px;display:flex;align-items:center;font-size:12px;color:#666;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
.nav-tab:hover{color:#111;}
.nav-tab.active{color:#111;border-bottom-color:#534AB7;font-weight:500;}
.nav-right{margin-left:auto;padding-left:1rem;flex-shrink:0;}
.si{font-size:11px;color:#888;white-space:nowrap;}
.si.saved{color:#1D9E75;}.si.unsaved{color:#EF9F27;}
.main{display:flex;flex:1;overflow:hidden;height:calc(100vh - 48px);}
.sidebar{width:230px;background:#fff;border-right:0.5px solid rgba(0,0,0,.15);overflow-y:auto;flex-shrink:0;}
.content{flex:1;overflow-y:auto;padding:1.25rem;}
.ss{padding:.875rem;border-bottom:0.5px solid rgba(0,0,0,.12);}
.sl{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:.5rem;}
.si2{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;cursor:pointer;margin-bottom:2px;}
.si2:hover{background:#f0f0ee;}
.si2.sel{background:#EEEDFE;color:#3C3489;}
.si2 .nm{font-size:12px;flex:1;}
.si2 .bx{font-size:10px;padding:1px 5px;border-radius:10px;background:#eee;color:#666;}
.si2.sel .bx{background:#AFA9EC;color:#26215C;}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;flex-shrink:0;}
.av-c{background:#E1F5EE;color:#085041;}.av-s{background:#E6F1FB;color:#0C447C;}
.add-btn{width:100%;padding:5px 7px;border:0.5px dashed rgba(0,0,0,.2);border-radius:6px;background:none;color:#888;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;margin-top:5px;font-family:inherit;}
.add-btn:hover{background:#f5f5f3;}
.card{background:#fff;border:0.5px solid rgba(0,0,0,.15);border-radius:12px;padding:1.125rem;margin-bottom:.875rem;}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem;}
.ct{font-size:14px;font-weight:500;}
/* Weekly/Today */
.wdc{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:8px;overflow:hidden;}
.wdh{padding:8px 10px;font-size:12px;font-weight:500;background:#f5f5f3;border-bottom:0.5px solid rgba(0,0,0,.12);display:flex;align-items:center;}
.wsl{padding:6px 8px;border-bottom:0.5px solid rgba(0,0,0,.08);}
.wsb{border-radius:6px;padding:6px 9px;margin-bottom:4px;cursor:pointer;transition:filter .1s;display:flex;align-items:flex-start;gap:6px;}
.wsb:hover{filter:brightness(.93);}
.wsb-info{flex:1;min-width:0;}
.wsb.wa{background:#E1F5EE;color:#085041;}
.wsb.wu{background:#FAECE7;color:#4A1B0C;border:1px dashed #F0997B;}
.wsb.wco{background:#F5C4B3;color:#4A1B0C;border:1px solid #F0997B;}
.wsb.wconflict{background:#FAECE7;color:#D85A30;border:1px solid #D85A30;}
.wsb.wtmp{background:#E6F1FB;color:#0C447C;border:1px dashed #85B7EB;}
.wsb-time{font-size:10px;opacity:.75;margin-bottom:1px;}
.wsb-client{font-size:11px;font-weight:500;}
.wsb-staff{font-size:10px;margin-top:2px;}
.wsb-del{background:none;border:none;cursor:pointer;font-size:14px;opacity:.4;padding:0 2px;color:inherit;flex-shrink:0;line-height:1;margin-top:1px;}
.wsb-del:hover{opacity:1;}
/* Today slots */
.ts{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:10px;margin-bottom:6px;cursor:pointer;}
.ts:hover{background:#fafaf9;}
.ts.tmp{border-color:#85B7EB;background:#E6F1FB;}
.sc2{font-size:11px;padding:2px 8px;border-radius:20px;background:#E6F1FB;color:#185FA5;}
.uc{font-size:11px;padding:2px 8px;border-radius:20px;background:#FAECE7;color:#993C1D;}
.cc{font-size:11px;padding:2px 8px;border-radius:20px;background:#F5C4B3;color:#4A1B0C;}
.tc{font-size:11px;padding:2px 8px;border-radius:20px;background:#E6F1FB;color:#0C447C;}
.pm{background:#f5f5f3;border:0.5px solid rgba(0,0,0,.12);border-radius:7px;padding:7px 9px;display:flex;align-items:center;gap:7px;cursor:pointer;}
.pm.ip{background:#E6F1FB;border-color:#85B7EB;}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:.625rem;}
.co2{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:7px;padding:8px 10px;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;}
.mg{background:#C0DD97;color:#173404;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;}
.mo{background:#FAC775;color:#412402;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;}
.mp{background:#F5C4B3;color:#4A1B0C;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;}
.cob{background:#FAECE7;border:0.5px solid #F0997B;border-radius:10px;padding:1rem;margin-bottom:.875rem;}
.cot{font-size:13px;font-weight:500;color:#4A1B0C;margin-bottom:.5rem;}
input[type=text],select{padding:6px 9px;border:0.5px solid rgba(0,0,0,.2);border-radius:6px;font-size:12px;background:#fff;color:#111;font-family:inherit;width:100%;}
input:focus,select:focus{outline:none;border-color:#7F77DD;}
.btn{padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;border:0.5px solid rgba(0,0,0,.2);background:#fff;color:#111;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.btn:hover{background:#eee;}
.btn-p{background:#534AB7;color:#fff;border-color:#534AB7;}.btn-p:hover{background:#3C3489;}
.btn-d{background:#D85A30;color:#fff;border-color:#D85A30;}.btn-d:hover{background:#993C1D;}
.btn-g{background:#1D9E75;color:#fff;border-color:#1D9E75;}.btn-g:hover{background:#085041;}
.btn-b{background:#185FA5;color:#fff;border-color:#185FA5;}.btn-b:hover{background:#0C447C;}
.btn-sm{padding:3px 8px;font-size:11px;}
.es{text-align:center;padding:2.5rem 1rem;color:#888;}
.lg{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem;}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:#777;}
.ld{width:10px;height:10px;border-radius:2px;}
.dr{width:7px;height:7px;border-radius:50%;display:inline-block;background:#E24B4A;}
.ie{border:none;background:transparent;font-size:13px;font-weight:500;font-family:inherit;color:#111;flex:1;max-width:200px;padding:2px 4px;border-radius:4px;}
.ie:focus{outline:none;background:#EEEDFE;}
.sx{overflow-x:auto;}
.sp{background:#fff;border:0.5px solid rgba(0,0,0,.15);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
.sp h3{font-size:14px;font-weight:500;margin-bottom:.75rem;}
/* AI chat */
.ai-wrap{display:flex;flex-direction:column;height:calc(100vh - 48px);max-width:820px;margin:0 auto;padding:1.25rem;gap:.75rem;}
.ai-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.75rem;padding-bottom:.5rem;}
.ai-msg{border-radius:12px;padding:.875rem 1rem;font-size:13px;line-height:1.6;max-width:90%;}
.ai-msg.user{background:#534AB7;color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.ai-msg.assistant{background:#fff;border:0.5px solid rgba(0,0,0,.12);align-self:flex-start;border-bottom-left-radius:4px;white-space:pre-wrap;}
.ai-msg.system{background:#f5f5f3;color:#888;font-size:11px;align-self:center;border-radius:8px;}
.ai-msg.error{background:#FAECE7;color:#D85A30;border:0.5px solid #F0997B;align-self:flex-start;}
.ai-input-row{display:flex;gap:8px;align-items:flex-end;}
.ai-input-row textarea{flex:1;padding:10px 12px;border:0.5px solid rgba(0,0,0,.2);border-radius:10px;font-size:13px;font-family:inherit;resize:none;line-height:1.5;min-height:44px;max-height:120px;overflow-y:auto;}
.ai-input-row textarea:focus{outline:none;border-color:#7F77DD;}
.ai-send{padding:10px 18px;border-radius:10px;background:#534AB7;color:#fff;border:none;font-size:13px;cursor:pointer;font-family:inherit;flex-shrink:0;align-self:flex-end;}
.ai-send:hover{background:#3C3489;}
.ai-send:disabled{background:#aaa;cursor:not-allowed;}
.ai-key-wrap{background:#EEEDFE;border:1px solid #AFA9EC;border-radius:10px;padding:1rem;margin-bottom:.75rem;}
.ai-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.5rem;}
.ai-sug{padding:5px 12px;border-radius:16px;border:1px solid #AFA9EC;background:#fff;color:#534AB7;font-size:12px;cursor:pointer;font-family:inherit;}
.ai-sug:hover{background:#EEEDFE;}
.ai-typing{display:flex;gap:4px;align-items:center;padding:.5rem .75rem;}
.ai-typing span{width:7px;height:7px;border-radius:50%;background:#aaa;animation:blink 1.2s infinite;}
.ai-typing span:nth-child(2){animation-delay:.2s;}
.ai-typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.toast{position:fixed;bottom:20px;right:20px;background:#1D9E75;color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:500;z-index:9999;display:none;pointer-events:none;}
.toast.err{background:#D85A30;}
/* Edit data time pickers */
.exs{background:#f5f5f3;border-radius:10px;padding:1rem;margin-top:.625rem;}
.exs h4{font-size:11px;font-weight:500;color:#777;margin-bottom:.625rem;text-transform:uppercase;letter-spacing:.04em;}
.dr2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.5rem;}
.dp{min-width:56px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:2px solid rgba(0,0,0,.18);background:#fff;color:#888;font-family:inherit;text-align:center;transition:all .12s;user-select:none;}
.dp:hover:not(.on){border-color:#7F77DD;color:#534AB7;background:#EEEDFE;}
.dp.on{background:#534AB7;color:#fff;border-color:#534AB7;}
.it{font-size:11px;color:#888;margin-top:6px;font-style:italic;}
/* BLOCK BUILDER — replaces the tiny cell grid */
.blk-builder{margin-top:.75rem;}
.blk-builder h4{font-size:11px;font-weight:500;color:#777;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem;}
.blk-day-row{margin-bottom:1rem;background:#f5f5f3;border-radius:10px;padding:.75rem;}
.blk-day-label{font-size:12px;font-weight:500;color:#534AB7;margin-bottom:.5rem;}
.blk-list{display:flex;flex-direction:column;gap:6px;margin-bottom:6px;}
.blk-item{background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;}
.blk-item.has-staff{border-color:#5DCAA5;background:#E1F5EE;}
.blk-item.no-staff{border-color:#F0997B;background:#FAECE7;}
.blk-time{font-size:12px;font-weight:500;min-width:140px;color:#333;}
.blk-staff-sel{flex:1;font-size:12px;}
.blk-del{background:none;border:none;cursor:pointer;color:#D85A30;font-size:16px;padding:0 4px;line-height:1;}
.blk-del:hover{color:#993C1D;}
.add-blk-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;}
.add-blk-row select{flex:1;min-width:90px;font-size:11px;padding:4px 6px;}
.add-blk-row .btn{font-size:11px;padding:4px 10px;}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;}
.modal-overlay.hidden{display:none;}
.modal-box{background:#fff;border-radius:12px;padding:1.25rem;width:320px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal-title{font-size:14px;font-weight:500;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;}
.modal-close{cursor:pointer;font-size:18px;color:#888;line-height:1;background:none;border:none;font-family:inherit;}
.modal-close:hover{color:#111;}
.staff-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px;border:1.5px solid transparent;}
.staff-opt:hover{background:#f5f5f3;}
.staff-opt.current{background:#E1F5EE;border-color:#5DCAA5;}
.staff-opt.unavail{opacity:.4;cursor:not-allowed;}
.staff-opt-name{font-size:13px;font-weight:500;flex:1;}
.staff-opt-sub{font-size:11px;color:#888;}
.modal-section{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:#999;margin:10px 0 5px;}
.unassign-btn{width:100%;padding:7px;border-radius:7px;border:0.5px solid rgba(0,0,0,.15);background:none;color:#D85A30;font-size:12px;cursor:pointer;font-family:inherit;margin-top:6px;}
.unassign-btn:hover{background:#FAECE7;}
.tb-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.tb-row label{font-size:12px;color:#555;min-width:60px;}
.tb-row select,.tb-row input[type=text]{flex:1;}
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <span class="nav-brand">&#x1F9E9; PodScheduler</span>
    <div class="nav-tab active" data-tab="today" onclick="go('today')">Today</div>
    <div class="nav-tab" data-tab="week" onclick="go('week')">Weekly</div>
    <div class="nav-tab" data-tab="clients" onclick="go('clients')">Clients</div>
    <div class="nav-tab" data-tab="staff" onclick="go('staff')">Staff</div>
    <div class="nav-tab" data-tab="pods" onclick="go('pods')">Pods</div>
    <div class="nav-tab" data-tab="callout" onclick="go('callout')">Callout</div>
    <div class="nav-tab" data-tab="data" onclick="go('data')">Edit Data</div>
    <div class="nav-tab" data-tab="save" onclick="go('save')">Save/Load</div>
    <div class="nav-tab" data-tab="ai" onclick="go('ai')">&#x1F916; AI Assistant</div>
    <div class="nav-right"><span class="si" id="si">Not saved</span></div>
  </div>
  <div class="main" id="mc"></div>
</div>

<!-- ASSIGN MODAL -->
<div class="modal-overlay hidden" id="assign-modal" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title">
      <span id="modal-title-text">Assign staff</span>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- TEMP BLOCK MODAL -->
<div class="modal-overlay hidden" id="temp-modal" onclick="closeTempModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title">
      <span>&#x2B; Add temporary block</span>
      <button class="modal-close" onclick="closeTempModal()">&#x2715;</button>
    </div>
    <div id="temp-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri'];
const ALL_DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function bT(){const o=[];for(let h=8;h<=17;h++){for(let m=0;m<60;m+=15){if(h===17&&m>0)break;const ap=h<12?'AM':'PM';const h12=h===0?12:h>12?h-12:h;o.push(`${h12}:${m===0?'00':m} ${ap}`);}}return o;}
const TIMES=bT();
function t2m(t){const[ti,ap]=t.split(' ');const[h,m]=ti.split(':').map(Number);let hr=h;if(ap==='PM'&&h!==12)hr=h+12;if(ap==='AM'&&h===12)hr=0;return hr*60+m;}
const SK='podscheduler_v4';

const DD={
  clients:[
    {id:'c1',name:'Margaret T.',schedule:{
      Mon:[{from:'9:00 AM',to:'12:45 PM',staffId:'s1'},{from:'1:00 PM',to:'4:45 PM',staffId:'s2'}],
      Wed:[{from:'9:00 AM',to:'10:00 AM',staffId:'s3'}],
      Fri:[{from:'9:00 AM',to:'11:00 AM',staffId:'s1'}]
    }},
    {id:'c2',name:'David R.',schedule:{
      Tue:[{from:'10:00 AM',to:'12:00 PM',staffId:'s2'}],
      Thu:[{from:'10:00 AM',to:'11:00 AM',staffId:'s4'}]
    }},
    {id:'c3',name:'Linda K.',schedule:{
      Mon:[{from:'1:00 PM',to:'2:00 PM',staffId:'s3'}],
      Wed:[{from:'1:00 PM',to:'3:00 PM',staffId:'s2'}]
    }},
    {id:'c4',name:'James B.',schedule:{
      Mon:[{from:'9:00 AM',to:'9:30 AM',staffId:'s1'}],
      Tue:[{from:'9:00 AM',to:'10:00 AM',staffId:'s4'}],
      Thu:[{from:'9:00 AM',to:'10:00 AM',staffId:'s4'}]
    }},
    {id:'c5',name:'Sandra W.',schedule:{
      Wed:[{from:'10:00 AM',to:'11:00 AM',staffId:'s5'}],
      Fri:[{from:'10:00 AM',to:'12:00 PM',staffId:'s5'}]
    }},
  ],
  staff:[
    {id:'s1',name:'Alex M.',availability:{Mon:['8:00 AM','8:15 AM','8:30 AM','8:45 AM','9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM','11:15 AM','11:30 AM','11:45 AM','12:00 PM','12:15 PM','12:30 PM','12:45 PM'],Tue:['9:00 AM','9:15 AM','9:30 AM','10:00 AM'],Wed:['9:00 AM','9:15 AM','9:30 AM','9:45 AM'],Fri:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM']}},
    {id:'s2',name:'Jordan P.',availability:{Mon:['1:00 PM','1:15 PM','1:30 PM','1:45 PM','2:00 PM','2:15 PM','2:30 PM','2:45 PM','3:00 PM','3:15 PM','3:30 PM','3:45 PM','4:00 PM','4:15 PM','4:30 PM','4:45 PM'],Tue:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM','11:15 AM','11:30 AM','11:45 AM','12:00 PM'],Wed:['1:00 PM','1:15 PM','1:30 PM','1:45 PM','2:00 PM','2:15 PM','2:30 PM','2:45 PM','3:00 PM'],Thu:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM']}},
    {id:'s3',name:'Taylor B.',availability:{Mon:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','1:00 PM','1:15 PM','1:30 PM','1:45 PM','2:00 PM'],Wed:['10:00 AM','10:15 AM','1:00 PM','1:15 PM','1:30 PM','1:45 PM','2:00 PM','2:15 PM','2:30 PM','2:45 PM','3:00 PM'],Fri:['2:00 PM','2:15 PM','2:30 PM','2:45 PM','3:00 PM']}},
    {id:'s4',name:'Morgan L.',availability:{Tue:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM'],Thu:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM'],Fri:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM','11:15 AM','11:30 AM','11:45 AM','12:00 PM']}},
    {id:'s5',name:'Riley C.',availability:{Mon:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM'],Wed:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM'],Thu:['10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM'],Fri:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM']}},
    {id:'s6',name:'Casey N.',availability:{Mon:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM','10:15 AM','10:30 AM','10:45 AM','11:00 AM'],Tue:['9:00 AM','9:15 AM'],Wed:['9:00 AM','9:15 AM','9:30 AM','9:45 AM','10:00 AM']}},
  ],
  pods:{c1:['s1','s2','s3','s5','s6'],c2:['s2','s4','s6'],c3:['s2','s3'],c4:['s1','s4','s6'],c5:['s1','s3','s5']},
  tempBlocks:[]
};

// Schedule is now [{from, to, staffId}] per day per client
// "from" and "to" are exact times like "9:00 AM", "1:00 PM"
// All 15-min slots between from and to (inclusive) belong to this block

function slotsInBlock(from, to){
  const lo=t2m(from), hi=t2m(to);
  // End is exclusive so adjacent blocks (e.g. 9-1 and 1-5) don't share the 1:00 slot.
  // Exception: single-point blocks (from === to) include the one slot.
  if(lo===hi) return TIMES.filter(t=>t2m(t)===lo);
  return TIMES.filter(t=>t2m(t)>=lo && t2m(t)<hi);
}

function initSDS(st){const sd={};st.forEach(s=>{sd[s.id]=new Set(Object.keys(s.availability).filter(d=>DAYS.includes(d)));});return sd;}

let S={
  tab:'today',
  ...JSON.parse(JSON.stringify(DD)),
  selClient:'c1',selStaff:'s1',calloutStaff:null,calledOut:[],
  edTab:'clients',expEdit:null,
  dirty:false,lastSaved:null,podView:'clients',selPodClient:null,selPodStaff:null,aiKey:'',aiMessages:[],aiLoading:false
};
S.selDaysS=initSDS(S.staff);

/* ===== MODAL ===== */
function openAssignModal(cid, day, blockIdx, isTemp, tempId){
  const c=gcN(cid);
  let blockFrom,blockTo,currentSid,slots;
  if(isTemp){
    const tb=S.tempBlocks.find(t=>t.id===tempId);
    if(!tb)return;
    blockFrom=tb.slots[0];blockTo=tb.slots[tb.slots.length-1];currentSid=tb.staffId;slots=tb.slots;
  } else {
    const blk=(c?.schedule[day]||[])[blockIdx];
    if(!blk)return;
    blockFrom=blk.from;blockTo=blk.to;currentSid=blk.staffId;slots=slotsInBlock(blk.from,blk.to);
  }
  const range=blockFrom+(blockFrom!==blockTo?' \u2013 '+blockTo:'');
  document.getElementById('modal-title-text').textContent=(c?.name||'?')+' \u00b7 '+day+' '+range;
  const pod=S.pods[cid]||[];
  // Staff used on other blocks this day
  const usedOther=new Set();
  (c?.schedule[day]||[]).forEach((blk2,i2)=>{
    if(!isTemp&&i2===blockIdx)return;
    if(blk2.staffId)usedOther.add(blk2.staffId);
  });
  S.tempBlocks.forEach(tb=>{if(tb.cid!==cid||tb.day!==day||tb.id===tempId)return;if(tb.staffId)usedOther.add(tb.staffId);});
  const avail=[],unavail=[];
  pod.forEach(sid=>{
    const s=gsN(sid);if(!s)return;
    const sAvail=new Set(s.availability[day]||[]);
    const covers=slots.every(sl=>sAvail.has(sl));
    if(covers)avail.push({sid,score:overlap(sid,cid),usedOther:usedOther.has(sid)});
    else unavail.push({sid});
  });
  avail.sort((a,b)=>a.usedOther!==b.usedOther?(a.usedOther?1:-1):b.score-a.score);
  let html='';
  if(avail.length){
    html+='<div class="modal-section">Available for this block</div>';
    avail.forEach(o=>{
      const s=gsN(o.sid);const isCur=o.sid===currentSid;
      // Check for conflicts with this assignment
      const conflict=checkConflict(o.sid,day,slots,cid,isTemp?-1:blockIdx,tempId||null);
      let subNote='';
      if(conflict.hasConflict){
        const cnames=conflict.conflicts.map(c=>c.name+' '+c.from+'-'+c.to).join(', ');
        subNote=`<div style="font-size:10px;color:#D85A30;margin-top:2px;font-weight:500">⚠ Double-booked: ${cnames}</div>`;
      } else if(o.usedOther){
        subNote=`<div style="font-size:10px;color:#888;margin-top:2px">Assigned to another block today</div>`;
      }
      const borderStyle=conflict.hasConflict?'border:1.5px solid #F0997B;':'';
      html+=`<div class="staff-opt${isCur?' current':''}" style="${borderStyle}" onclick="doAssign('${cid}','${day}',${isTemp?-1:blockIdx},'${o.sid}','${tempId||''}')">
        <div class="av av-s" style="width:28px;height:28px;font-size:10px">${ini(s.name)}</div>
        <div style="flex:1"><div class="staff-opt-name">${s.name}${isCur?' \u2713':''} ${conflict.hasConflict?'<span style=\"font-size:11px;color:#D85A30\">⚠</span>':''}</div><div class="staff-opt-sub">${o.score} overlap slots</div>${subNote}</div>
      </div>`;
    });
  }
  if(unavail.length){
    html+='<div class="modal-section">Not available for full block</div>';
    unavail.forEach(o=>{const s=gsN(o.sid);html+=`<div class="staff-opt unavail"><div class="av av-s" style="width:28px;height:28px;font-size:10px">${ini(s.name)}</div><div class="staff-opt-name">${s.name}</div></div>`;});
  }
  if(!pod.length)html='<div style="font-size:12px;color:#888;padding:.5rem 0">No pod members yet. Go to Clients tab to add pod members.</div>';
  if(currentSid||isTemp)html+=`<button class="unassign-btn" onclick="doAssign('${cid}','${day}',${isTemp?-1:blockIdx},null,'${tempId||''}')">Remove assignment</button>`;
  if(isTemp)html+=`<button class="unassign-btn" style="color:#534AB7;border-color:#534AB7;margin-top:4px" onclick="deleteTempBlock('${tempId}')">Delete this temp block</button>`;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('assign-modal').classList.remove('hidden');
}

function closeModal(){document.getElementById('assign-modal').classList.add('hidden');}

function doAssign(cid,day,blockIdx,newSid,tempId){
  if(tempId){
    const tb=S.tempBlocks.find(t=>t.id===tempId);if(tb)tb.staffId=newSid||null;
  } else {
    const blk=(gcN(cid)?.schedule[day]||[])[blockIdx];if(blk)blk.staffId=newSid||null;
  }
  markDirty();closeModal();render();
}

function deleteTempBlock(id){S.tempBlocks=S.tempBlocks.filter(t=>t.id!==id);markDirty();closeModal();render();}

  const clientOpts=S.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  const startOpts=TIMES.map(t=>`<option value="${t}">${t}</option>`).join('');

  document.getElementById('temp-body').innerHTML=`

    <div class="tb-row"><label>Day</label><select id="tb-day">${dayOpts}</select></div>
    <div class="tb-row"><label>Start</label><select id="tb-start" onchange="syncTbEnd()">${startOpts}</select></div>
    <div class="tb-row"><label>Finish</label><select id="tb-end">${endOpts}</select></div>

    </div>
    <div style="font-size:11px;color:#888;margin-top:.75rem;line-height:1.6">The block will appear in Today and Weekly views. Click it to assign staff from the client's pod.</div>`;

function closeTempModal(){document.getElementById('temp-modal').classList.add('hidden');}
function syncTbEnd(){
  const ss=document.getElementById('tb-start'),es=document.getElementById('tb-end');
  if(!ss||!es)return;
  const tgt=t2m(ss.value)+60;
  let best=TIMES[TIMES.length-1];
  TIMES.forEach(t=>{if(t2m(t)<=tgt)best=t;});
  es.value=best;
}
function createTempBlock(){
  const cid=document.getElementById('tb-client').value;
  const day=document.getElementById('tb-day').value;
  const from=document.getElementById('tb-start').value;
  const to=document.getElementById('tb-end').value;
  const label=document.getElementById('tb-label').value.trim()||'Temp block';
  if(t2m(to)<=t2m(from)){showToast('Finish must be after start',true);return;}
  const slots=slotsInBlock(from,to);
  const id='tb'+Date.now();
  const pod=S.pods[cid]||[];
  let bestSid=null,bestScore=-1;
  pod.forEach(sid=>{
    if(S.calledOut.includes(sid))return;
    const s=gsN(sid);if(!s)return;
    const av=new Set(s.availability[day]||[]);
    if(!slots.every(sl=>av.has(sl)))return;
    const sc=overlap(sid,cid);if(sc>bestScore){bestScore=sc;bestSid=sid;}
  });
  S.tempBlocks.push({id,cid,day,slots,from,to,staffId:bestSid,label});
  markDirty();closeTempModal();render();
  showToast(bestSid?`Block created \u2014 assigned to ${gsN(bestSid)?.name}`:'Block created \u2014 tap it to assign staff',false);
}

/* ===== SCHEDULE BLOCK BUILDER (in Clients tab) ===== */
// Add a new block row to a client's day
function addBlock(cid, day){
  const c=gcN(cid);if(!c)return;
  if(!c.schedule[day])c.schedule[day]=[];
  const existing=c.schedule[day];
  // Default: start after last block ends, or 9am
  let defFrom='9:00 AM';
  if(existing.length){
    const last=existing[existing.length-1];
    const idx=TIMES.indexOf(last.to);
    defFrom=TIMES[Math.min(idx+1,TIMES.length-1)]||last.to;
  }
  const defToIdx=Math.min(TIMES.indexOf(defFrom)+4,TIMES.length-1);
  const defTo=TIMES[defToIdx]||defFrom;
  existing.push({from:defFrom,to:defTo,staffId:null});
  markDirty();render();
}

function deleteBlock(cid, day, idx){
  const c=gcN(cid);if(!c)return;
  (c.schedule[day]||[]).splice(idx,1);
  if(!(c.schedule[day]||[]).length)delete c.schedule[day];
  markDirty();render();
}

function updateBlockFrom(cid,day,idx,val){
  const blk=(gcN(cid)?.schedule[day]||[])[idx];if(!blk)return;
  blk.from=val;if(t2m(blk.to)<=t2m(val)){const ti=TIMES.indexOf(val);blk.to=TIMES[Math.min(ti+4,TIMES.length-1)]||val;}
  markDirty();render();
}
function updateBlockTo(cid,day,idx,val){
  const blk=(gcN(cid)?.schedule[day]||[])[idx];if(!blk)return;
  blk.to=val;markDirty();render();
}
function updateBlockStaff(cid,day,idx,sid){
  const blk=(gcN(cid)?.schedule[day]||[])[idx];if(!blk)return;
  blk.staffId=sid||null;markDirty();render();
}
function toggleDay(cid,day){
  const c=gcN(cid);if(!c)return;
  if(c.schedule[day]){delete c.schedule[day];}
  else{c.schedule[day]=[];addBlock(cid,day);return;}
  markDirty();render();
}

/* ===== HELPERS ===== */
function ini(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function gcN(id){return S.clients.find(c=>c.id===id);}
function gsN(id){return S.staff.find(s=>s.id===id);}
function overlap(sid,cid){
  const c=gcN(cid),s=gsN(sid);if(!c||!s)return 0;
  let o=0;
  DAYS.forEach(d=>{
    const cs=new Set((c.schedule[d]||[]).flatMap(blk=>slotsInBlock(blk.from,blk.to)));
    (s.availability[d]||[]).forEach(t=>{if(cs.has(t))o++;});
  });
  return o;
}
// Returns all time slots a staff member is assigned to on a given day (across all clients + temp blocks)
function getStaffDaySlots(sid, day){
  const slots = new Set();
  S.clients.forEach(c=>{
    (c.schedule[day]||[]).forEach(blk=>{
      if(blk.staffId===sid) slotsInBlock(blk.from,blk.to).forEach(s=>slots.add(s));
    });
  });
  (S.tempBlocks||[]).forEach(tb=>{
    if(tb.staffId===sid&&tb.day===day) tb.slots.forEach(s=>slots.add(s));
  });
  return slots;
}

// Returns conflicts for a proposed assignment: {hasConflict, conflictingClients:[{name,from,to}]}
function checkConflict(sid, day, newSlots, excludeCid, excludeBlockIdx, excludeTempId){
  const conflicts=[];
  const newSet=new Set(newSlots);
  S.clients.forEach(c=>{
    (c.schedule[day]||[]).forEach((blk,idx)=>{
      if(blk.staffId!==sid)return;
      if(c.id===excludeCid&&idx===excludeBlockIdx)return; // same block being reassigned
      const overlap=slotsInBlock(blk.from,blk.to).filter(s=>newSet.has(s));
      if(overlap.length>0)conflicts.push({name:c.name,from:blk.from,to:blk.to});
    });
  });
  (S.tempBlocks||[]).forEach(tb=>{
    if(tb.staffId!==sid||tb.day!==day)return;
    if(tb.id===excludeTempId)return;
    const overlap=tb.slots.filter(s=>newSet.has(s));
    if(overlap.length>0)conflicts.push({name:gcN(tb.cid)?.name||'?'+' (temp)',from:tb.from,to:tb.to});
  });
  return{hasConflict:conflicts.length>0,conflicts};
}

// Check if any staff member is double-booked on a given day (for badge display)
function getConflictingStaffOnDay(day){
  const staffSlots={}; // sid -> [{from,to,clientName}]
  S.clients.forEach(c=>{
    (c.schedule[day]||[]).forEach(blk=>{
      if(!blk.staffId)return;
      if(!staffSlots[blk.staffId])staffSlots[blk.staffId]=[];
      staffSlots[blk.staffId].push({slots:new Set(slotsInBlock(blk.from,blk.to)),from:blk.from,to:blk.to,name:c.name});
    });
  });
  (S.tempBlocks||[]).forEach(tb=>{
    if(!tb.staffId||tb.day!==day)return;
    if(!staffSlots[tb.staffId])staffSlots[tb.staffId]=[];
    staffSlots[tb.staffId].push({slots:new Set(tb.slots),from:tb.from,to:tb.to,name:(gcN(tb.cid)?.name||'?')+' (temp)'});
  });
  const conflicting=new Set();
  Object.entries(staffSlots).forEach(([sid,blocks])=>{
    for(let i=0;i<blocks.length;i++){
      for(let j=i+1;j<blocks.length;j++){
        const overlap=[...blocks[i].slots].some(s=>blocks[j].slots.has(s));
        if(overlap){conflicting.add(sid);break;}
      }
    }
  });
  return conflicting;
}

function bestForSlot(cid,day,slot,excl){
  const pod=S.pods[cid]||[];const res=[];
  pod.forEach(sid=>{if(sid===excl||S.calledOut.includes(sid))return;const s=gsN(sid);if(!s)return;if((s.availability[day]||[]).includes(slot))res.push({sid,score:overlap(sid,cid)});});
  return res.sort((a,b)=>b.score-a.score);
}
function todayDay(){const d=ALL_DAYS[new Date().getDay()];return DAYS.includes(d)?d:DAYS[0];}
function go(t){S.tab=t;document.querySelectorAll('.nav-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();}
function fmtBlock(blk){return blk.from+(blk.from!==blk.to?' \u2013 '+blk.to:'');}

// Get all blocks for a day (regular + temp), sorted by start time
function getDayBlocks(day){
  const out=[];
  S.clients.forEach(c=>{
    (c.schedule[day]||[]).forEach((blk,idx)=>{
      out.push({client:c,from:blk.from,to:blk.to,staffId:blk.staffId,isTemp:false,blockIdx:idx});
    });
  });
  (S.tempBlocks||[]).filter(tb=>tb.day===day).forEach(tb=>{
    const c=gcN(tb.cid);if(!c)return;
    out.push({client:c,from:tb.from,to:tb.to,staffId:tb.staffId,isTemp:true,tempId:tb.id,label:tb.label});
  });
  out.sort((a,b)=>t2m(a.from)-t2m(b.from));
  return out;
}

/* ===== RENDERS ===== */

      <button class="btn btn-d" style="width:100%" onclick="mkCO()">Mark called out</button></div>
    <div class="ss"><div class="sl">Today \u2014 ${today}</div>
      <div style="background:#E1F5EE;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#085041">Covered</div><div style="font-size:20px;font-weight:500;color:#085041">${cov}</div></div>
      <div style="background:#FAECE7;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#4A1B0C">Needs coverage</div><div style="font-size:20px;font-weight:500;color:#4A1B0C">${unc}</div></div>
      ${getConflictingStaffOnDay(today).size>0?`<div style="background:#FAECE7;border:1px solid #D85A30;border-radius:7px;padding:.625rem;margin-bottom:8px"><div style="font-size:10px;color:#D85A30;font-weight:500">⚠ Conflicts</div><div style="font-size:16px;font-weight:500;color:#D85A30">${getConflictingStaffOnDay(today).size} staff double-booked</div></div>`:''}
      <button class="btn btn-b" style="width:100%" onclick="openTempModal('${today}')">+ Add temp block</button></div>
    <div class="ss"><button class="btn btn-g" style="width:100%" onclick="doSave()">Save now</button></div>
  </div><div class="content">${banner}<div class="card"><div class="ch"><div class="ct">Today's Sessions \u2014 ${today}</div></div>${sh}</div></div></div>`;
}

function rWeek(){
  const byDay={};DAYS.forEach(d=>byDay[d]=getDayBlocks(d));
  const total=Object.values(byDay).reduce((s,a)=>s+a.length,0);
  const cov=Object.values(byDay).reduce((s,a)=>s+a.filter(x=>x.staffId&&!S.calledOut.includes(x.staffId)).length,0);
  const cols=DAYS.map(d=>{
    const blocks=byDay[d];const isToday=d===todayDay();
    const inner=blocks.length===0?`<div style="padding:8px;font-size:11px;color:#888">No sessions</div>`
      :blocks.map(bl=>{
        const co=bl.staffId&&S.calledOut.includes(bl.staffId);
        const dayConflicts=getConflictingStaffOnDay(d);
        const hasConflict=bl.staffId&&dayConflicts.has(bl.staffId)&&!co;
        const cls=bl.isTemp?'wtmp':co?'wco':hasConflict?'wconflict':bl.staffId?'wa':'wu';
        const sname=bl.staffId?(co?`\u26a0 ${gsN(bl.staffId)?.name} (out)`:hasConflict?`\u26a0 ${gsN(bl.staffId)?.name} (conflict)`:`${gsN(bl.staffId)?.name}`):'Tap to assign';
        const bkey=regBlock('w_'+bl.client.id+'_'+d+'_'+bl.from.replace(/ /g,'')+(bl.isTemp?bl.tempId:bl.blockIdx),
          {cid:bl.client.id,day:d,blockIdx:bl.blockIdx??-1,isTemp:!!bl.isTemp,tempId:bl.tempId||null});
        // Delete button — stops propagation so it doesn't open modal
        const delBtn=bl.isTemp
          ?`<button class="wsb-del" onclick="event.stopPropagation();deleteTempBlock('${bl.tempId}')" title="Delete block">\u2715</button>`
          :`<button class="wsb-del" onclick="event.stopPropagation();deleteBlock('${bl.client.id}','${d}',${bl.blockIdx})" title="Delete block">\u2715</button>`;
        return`<div class="wsl"><div class="wsb ${cls}" onclick="openBlock('${bkey}')">
          <div class="wsb-info">
            <div class="wsb-time">${fmtBlock(bl)}${bl.isTemp?' \u2022 TEMP':''}</div>
            <div class="wsb-client">${bl.client.name}</div>
            <div class="wsb-staff">${sname}</div>
          </div>
          ${delBtn}
        </div></div>`;
      }).join('');
    return`<div class="wdc" style="${isToday?'border-color:#7F77DD':''}">

      </div>${inner}
    </div>`;
  }).join('');
  return`<div style="width:100%"><div class="sidebar">
    <div class="ss"><div class="sl">This week</div>
      <div style="background:#E6F1FB;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#042C53">Total</div><div style="font-size:20px;font-weight:500;color:#042C53">${total}</div></div>
      <div style="background:#E1F5EE;border-radius:7px;padding:.625rem;margin-bottom:5px"><div style="font-size:10px;color:#085041">Covered</div><div style="font-size:20px;font-weight:500;color:#085041">${cov}</div></div>
      <div style="background:#FAECE7;border-radius:7px;padding:.625rem"><div style="font-size:10px;color:#4A1B0C">Gaps</div><div style="font-size:20px;font-weight:500;color:#4A1B0C">${total-cov}</div></div></div>
    <div class="ss" style="font-size:11px;color:#888;line-height:1.6">Click a block to reassign staff.<br>Click <strong>&#x2715;</strong> on a block to delete it.</div>

function rBlockBuilder(c){
  const activeDays=DAYS.filter(d=>c.schedule[d]);
  const staffOpts=['<option value="">-- Unassigned --</option>'].concat(
    (S.pods[c.id]||[]).map(sid=>{const s=gsN(sid);return s?`<option value="${sid}">${s.name}</option>`:'';})).join('');
  let html=`<div class="blk-builder">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem">
      <h4 style="font-size:11px;font-weight:500;color:#777;text-transform:uppercase;letter-spacing:.04em">Schedule by day</h4>
    </div>
    <div class="dr2" style="margin-bottom:1rem">`;
  DAYS.forEach(d=>{const on=activeDays.includes(d);html+=`<button class="dp${on?' on':''}" onclick="toggleDay('${c.id}','${d}')">${d}</button>`;});
  html+=`</div>`;
  if(activeDays.length===0){html+=`<div class="it">Click a day above to start building the schedule.</div></div>`;return html;}
  activeDays.forEach(d=>{
    const blocks=c.schedule[d]||[];
    html+=`<div class="blk-day-row">
      <div class="blk-day-label">${d}</div>
      <div class="blk-list">`;
    blocks.forEach((blk,idx)=>{
      const fromOpts=TIMES.map(t=>`<option value="${t}"${t===blk.from?'selected':''}>${t}</option>`).join('');
      const toOpts=TIMES.map(t=>`<option value="${t}"${t===blk.to?'selected':''}>${t}</option>`).join('');
      const curStaffOpts=['<option value="">-- Unassigned --</option>'].concat(
        (S.pods[c.id]||[]).map(sid=>{const s=gsN(sid);return s?`<option value="${sid}"${sid===blk.staffId?'selected':''}>${s.name}</option>`:'';})).join('');
      const hasStaff=!!blk.staffId;
      html+=`<div class="blk-item${hasStaff?' has-staff':' no-staff'}">
        <select style="width:100px;font-size:11px;padding:3px 5px" onchange="updateBlockFrom('${c.id}','${d}',${idx},this.value)">${fromOpts}</select>
        <span style="font-size:11px;color:#888">to</span>
        <select style="width:100px;font-size:11px;padding:3px 5px" onchange="updateBlockTo('${c.id}','${d}',${idx},this.value)">${toOpts}</select>
        <select class="blk-staff-sel" style="font-size:11px;padding:3px 5px" onchange="updateBlockStaff('${c.id}','${d}',${idx},this.value)">${curStaffOpts}</select>
        <button class="blk-del" onclick="deleteBlock('${c.id}','${d}',${idx})" title="Remove block">\u2715</button>
      </div>`;
    });
    html+=`</div>
      <button class="btn btn-sm" style="font-size:11px;color:#534AB7;border-color:#534AB7;background:#EEEDFE" onclick="addBlock('${c.id}','${d}')">+ Add block</button>
    </div>`;
  });
  html+=`</div>`;return html;
}

    const pod=S.pods[S.selPodClient]||[];

          <button class="btn btn-d btn-sm" onclick="removePodMember('${S.selPodClient}','${sid}')">Remove</button>

        <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">
          <div class="av av-c" style="width:26px;height:26px">${ini(c.name)}</div>
          <div style="flex:1"><div style="font-size:12px;font-weight:500">${c.name}</div><div style="font-size:10px;color:#888">${p.length} staff</div></div>
          <span style="font-size:10px;padding:2px 6px;border-radius:8px;background:${pok?'#C0DD97':'#F5C4B3'};color:${pok?'#173404':'#4A1B0C'}">${pok?'Good':''+p.length}</span>
        </div>
        ${p.map(sid=>{const st=gsN(sid);const out=S.calledOut.includes(sid);return st?`<div style="display:flex;align-items:center;gap:5px;padding:3px 0;font-size:11px"><div class="av av-s" style="width:18px;height:18px;font-size:7px">${ini(st.name)}</div><span style="flex:1">${st.name}</span>${out?'<span style="color:#E24B4A;font-size:10px">out</span>':''}</div>`:'';}).join('')}
      </div>`;}).join('');

    return`<div style="width:100%;flex-direction:column" class="content">
      ${toggleBtns}
      <h3 style="font-size:13px;font-weight:500;color:#888;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.04em">All client pods — click to manage</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem;margin-bottom:1.5rem">${allPodsHtml}</div>

  // All staff overview grid
  const allStaffHtml=S.staff.map(st=>{
    const myC=Object.entries(S.pods).filter(([cid,pod])=>pod.includes(st.id));

    </div>`;}).join('');

  return`<div style="width:100%;flex-direction:column" class="content">

    <div class="card" style="max-width:560px">
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.875rem;flex-wrap:wrap">
        <div class="ct">Edit pods for:</div>
        <select style="flex:1;max-width:200px" onchange="S.selPodStaff=this.value;render()">${staffOpts}</select>
        <span style="font-size:11px;color:#888">${myClients.length} client pod${myClients.length!==1?'s':''}</span>

function addPodMember(cid){
  const sel=document.getElementById('add-pod-sel');if(!sel?.value)return;
  const sid=sel.value;
  if(!S.pods[cid])S.pods[cid]=[];
  if(!S.pods[cid].includes(sid))S.pods[cid].push(sid);
  markDirty();render();
}
function removePodMember(cid,sid){
  if(!S.pods[cid])return;
  S.pods[cid]=S.pods[cid].filter(s=>s!==sid);
  markDirty();render();
}
function addStaffToPod(sid){
  const sel=document.getElementById('add-client-pod-sel');if(!sel?.value)return;
  const cid=sel.value;
  if(!S.pods[cid])S.pods[cid]=[];
  if(!S.pods[cid].includes(sid))S.pods[cid].push(sid);
  markDirty();render();
}

function rCallout(){
  const aff=[];
  if(S.calloutStaff){
    S.clients.forEach(c=>{DAYS.forEach(d=>{(c.schedule[d]||[]).forEach((blk,idx)=>{if(blk.staffId===S.calloutStaff){const slots=slotsInBlock(blk.from,blk.to);const best=bestForSlot(c.id,d,slots[0],S.calloutStaff);aff.push({cid:c.id,day:d,blockIdx:idx,from:blk.from,to:blk.to,best});}});});});
    (S.tempBlocks||[]).forEach(tb=>{if(tb.staffId===S.calloutStaff){const best=bestForSlot(tb.cid,tb.day,tb.slots[0],S.calloutStaff);aff.push({cid:tb.cid,day:tb.day,blockIdx:-1,from:tb.from,to:tb.to,best,isTemp:true,tempId:tb.id});}});
  }
  return`<div style="width:100%"><div class="sidebar"><div class="ss"><div class="sl">Select staff</div>
    ${S.staff.map(s=>{const out=S.calledOut.includes(s.id);return`<div class="si2 ${S.calloutStaff===s.id?'sel':''}" onclick="selCO('${s.id}')"><div class="av av-s">${ini(s.name)}</div><span class="nm">${s.name}</span>${out?'<span class="bx" style="background:#F5C4B3;color:#4A1B0C">Out</span>':''}</div>`;}).join('')}

function rAG(s){
  // Build assigned slots map: day -> {slot -> {clientName, from, to}}
  const assigned={};
  DAYS.forEach(d=>{ assigned[d]={}; });
  S.clients.forEach(c=>{
    DAYS.forEach(d=>{
      (c.schedule[d]||[]).forEach(blk=>{
        if(blk.staffId!==s.id)return;
        slotsInBlock(blk.from,blk.to).forEach(slot=>{
          assigned[d][slot]={clientName:c.name,from:blk.from,to:blk.to};
        });
      });
    });
  });
  (S.tempBlocks||[]).forEach(tb=>{
    if(tb.staffId!==s.id)return;
    if(!assigned[tb.day])assigned[tb.day]={};
    tb.slots.forEach(slot=>{
      assigned[tb.day][slot]={clientName:(gcN(tb.cid)?.name||'?')+' (temp)',from:tb.from,to:tb.to,isTemp:true};
    });
  });

  let out='';
  // Legend
  out+=`<div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.625rem;font-size:10px;color:#777">
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#9FE1CB;display:inline-block"></span>Scheduled</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#E6F1FB;border:0.5px solid #85B7EB;display:inline-block"></span>Available</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#f5f5f3;border:0.5px solid rgba(0,0,0,.1);display:inline-block"></span>Unavailable</span>
  </div>`;
  // Grid
  out+=`<div style="overflow-x:auto"><div style="display:grid;grid-template-columns:72px repeat(5,1fr);gap:2px;min-width:420px"><div></div>`;
  DAYS.forEach(d=>{out+=`<div style="text-align:center;font-size:10px;font-weight:500;color:#888;padding:5px 3px;text-transform:uppercase">${d}</div>`;});
  TIMES.forEach(t=>{
    const isH=t.endsWith(':00 AM')||t.endsWith(':00 PM');
    out+=`<div style="font-size:9px;color:#888;padding:0 4px;display:flex;align-items:center;justify-content:flex-end;height:22px">${isH?t:''}</div>`;
    DAYS.forEach(d=>{
      const av=(s.availability[d]||[]).includes(t);
      const asgn=assigned[d]?.[t];
      let bg,border,title='',cursor='default';
      if(asgn){bg='#9FE1CB';border='#1D9E75';title=`${asgn.clientName} ${asgn.from}\u2013${asgn.to}`;cursor='help';}
      else if(av){bg='#E6F1FB';border='#85B7EB';title='Available';}
      else{bg='transparent';border='rgba(0,0,0,.08)';}
      out+=`<div style="height:22px;border-radius:2px;border:0.5px solid ${border};background:${bg};cursor:${cursor}" title="${title}"></div>`;
    });
  });
  out+=`</div></div>`;
  // Weekly assignment summary
  const weekSummary=[];
  DAYS.forEach(d=>{
    const dayBlocks=[];
    S.clients.forEach(c=>{
      (c.schedule[d]||[]).forEach(blk=>{if(blk.staffId===s.id)dayBlocks.push({clientName:c.name,from:blk.from,to:blk.to});});
    });
    (S.tempBlocks||[]).forEach(tb=>{if(tb.staffId===s.id&&tb.day===d)dayBlocks.push({clientName:(gcN(tb.cid)?.name||'?')+' (temp)',from:tb.from,to:tb.to});});
    if(dayBlocks.length)weekSummary.push({day:d,blocks:dayBlocks.sort((a,b)=>t2m(a.from)-t2m(b.from))});
  });
  if(weekSummary.length){
    out+=`<div style="margin-top:1rem"><div style="font-size:11px;font-weight:500;color:#555;margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.04em">This week's assignments</div>`;
    weekSummary.forEach(({day,blocks})=>{
      out+=`<div style="margin-bottom:6px"><span style="font-size:11px;font-weight:500;color:#534AB7;min-width:36px;display:inline-block">${day}</span>`;
      blocks.forEach(b=>{out+=` <span style="font-size:11px;background:#E1F5EE;color:#085041;padding:2px 8px;border-radius:12px;margin-right:4px">${b.clientName} ${b.from}\u2013${b.to}</span>`;});
      out+=`</div>`;
    });
    out+=`</div>`;
  } else {
    out+=`<div style="font-size:11px;color:#888;margin-top:.75rem;font-style:italic">No sessions assigned this week.</div>`;
  }
  return out;
}

function togExp(id){S.expEdit=S.expEdit===id?null:id;if(S.expEdit!==id)S.rStart=null;render();}
function togPod(cid,sid){if(!S.pods[cid])S.pods[cid]=[];const i=S.pods[cid].indexOf(sid);if(i>=0)S.pods[cid].splice(i,1);else S.pods[cid].push(sid);markDirty();render();}
function togSS(sid,day,slot){const s=gsN(sid);if(!s)return;if(!s.availability[day])s.availability[day]=[];const i=s.availability[day].indexOf(slot);if(i>=0)s.availability[day].splice(i,1);else s.availability[day].push(slot);markDirty();render();}
function togSD(sid,day){const s=gsN(sid);if(!s)return;if(!S.selDaysS[sid])S.selDaysS[sid]=new Set();const sel=S.selDaysS[sid];if(sel.has(day)){sel.delete(day);delete s.availability[day];}else{sel.add(day);if(!s.availability[day])s.availability[day]=[];}if(S.rEid===sid){S.rStart=null;S.rDay=null;S.rType=null;S.rEid=null;}markDirty();render();}
function clkST(sid,day,time){const s=gsN(sid);if(!s)return;if(!s.availability[day])s.availability[day]=[];if(S.rType==='staff'&&S.rEid===sid&&S.rStart&&S.rDay===day){const lo=Math.min(t2m(S.rStart),t2m(time));const hi=Math.max(t2m(S.rStart),t2m(time));const inR=TIMES.filter(t=>t2m(t)>=lo&&t2m(t)<=hi);const sel=new Set(s.availability[day]);inR.forEach(t=>sel.add(t));s.availability[day]=[...sel];S.rStart=null;S.rDay=null;S.rType=null;S.rEid=null;markDirty();render();}else if(S.rType==='staff'&&S.rEid===sid&&S.rStart===time&&S.rDay===day){const sel=new Set(s.availability[day]);if(sel.has(time))sel.delete(time);else sel.add(time);s.availability[day]=[...sel];S.rStart=null;S.rDay=null;S.rType=null;S.rEid=null;markDirty();render();}else{S.rStart=time;S.rDay=day;S.rType='staff';S.rEid=sid;render();}}
function saSD(sid,day){const s=gsN(sid);if(!s)return;s.availability[day]=[...TIMES];markDirty();render();}
function clrSD(sid,day){const s=gsN(sid);if(!s)return;s.availability[day]=[];markDirty();render();}

function buildScheduleContext(){
  const lines=[];
  lines.push('=== TODAY IS '+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()]+' ===');
  lines.push('\n=== CLIENTS & SCHEDULES ===');
  S.clients.forEach(c=>{
    lines.push('\nClient: '+c.name);
    const pod=(S.pods[c.id]||[]).map(sid=>gsN(sid)?.name||sid).join(', ');
    lines.push('  Pod ('+( S.pods[c.id]||[]).length+' staff): '+pod);
    const days=Object.keys(c.schedule||{});
    if(!days.length){lines.push('  No schedule set');return;}
    days.forEach(d=>{
      (c.schedule[d]||[]).forEach(blk=>{
        const sname=blk.staffId?gsN(blk.staffId)?.name:'UNASSIGNED';
        lines.push('  '+d+': '+blk.from+' – '+blk.to+' → '+sname);
      });
    });
  });
  lines.push('\n=== STAFF & AVAILABILITY ===');
  S.staff.forEach(s=>{
    const out=S.calledOut.includes(s.id);
    const pods=Object.entries(S.pods).filter(([cid,pod])=>pod.includes(s.id)).map(([cid])=>gcN(cid)?.name||cid).join(', ');
    lines.push('\nStaff: '+s.name+(out?' [CALLED OUT TODAY]':''));
    lines.push('  Clients: '+( pods||'none'));
    const avDays=Object.keys(s.availability||{}).filter(d=>s.availability[d].length>0);
    avDays.forEach(d=>{
      const sl=s.availability[d];
      const from=sl[0],to=sl[sl.length-1];
      lines.push('  Available '+d+': '+from+' – '+to);
    });
  });
  if((S.tempBlocks||[]).length){
    lines.push('\n=== TEMP BLOCKS ===');
    S.tempBlocks.forEach(tb=>{
      const sname=tb.staffId?gsN(tb.staffId)?.name:'UNASSIGNED';
      lines.push('  '+gcN(tb.cid)?.name+' | '+tb.day+' '+tb.from+'–'+tb.to+' | '+sname+(tb.label?' ('+tb.label+')':''));
    });
  }
  if(S.calledOut.length){
    lines.push('\n=== CALLED OUT TODAY ===');
    lines.push(S.calledOut.map(sid=>gsN(sid)?.name||sid).join(', '));
  }
  return lines.join('\n');
}

async function sendAIMessage(){
  const inp=document.getElementById('ai-inp');
  if(!inp)return;
  const text=inp.value.trim();
  if(!text)return;
  if(!S.aiKey){showToast('Enter your API key first',true);return;}
  inp.value='';inp.style.height='44px';
  S.aiMessages.push({role:'user',content:text});
  S.aiLoading=true;
  render();
  // Scroll to bottom
  setTimeout(()=>{const msgs=document.getElementById('ai-msgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;},50);
  try{
    const systemPrompt=`You are a scheduling assistant for a care/support services organization. You have full access to the current schedule data below. Help the user manage their schedule, suggest coverage solutions, identify conflicts or gaps, and answer questions about staff and client assignments. Be concise and practical. When suggesting changes, be specific (name the staff member, client, day, and time). Format lists clearly.\n\nCURRENT SCHEDULE DATA:\n${buildScheduleContext()}`;
    const messages=S.aiMessages.map(m=>({role:m.role,content:m.content}));
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-ipc':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:systemPrompt,messages})
    });
    const data=await res.json();
    if(data.error){throw new Error(data.error.message||'API error');}
    const reply=data.content?.[0]?.text||'No response';
    S.aiMessages.push({role:'assistant',content:reply});
  }catch(e){
    S.aiMessages.push({role:'error',content:'Error: '+e.message+'. Check your API key and try again.'});
  }
  S.aiLoading=false;
  render();
  setTimeout(()=>{const msgs=document.getElementById('ai-msgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;},50);
}

function rAI(){
  loadAIKey();
  const keySet=!!S.aiKey;
  const suggestions=[
    'Who is overloaded this week?',
    'Which clients have the weakest pod coverage?',
    'Are there any scheduling conflicts I should know about?',
    'Suggest how to balance the workload more evenly',
    'Who can cover if someone calls out today?',
  ];
  const msgsHtml=S.aiMessages.map(m=>{
    const cls=m.role==='error'?'error':m.role;
    return`<div class="ai-msg ${cls}">${m.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;
  }).join('');
  const typingHtml=S.aiLoading?`<div class="ai-msg assistant"><div class="ai-typing"><span></span><span></span><span></span></div></div>`:'';

  return`<div class="ai-wrap">
    ${!keySet?`<div class="ai-key-wrap">
      <div style="font-size:13px;font-weight:500;margin-bottom:.5rem">Enter your Anthropic API key to enable AI</div>
      <div style="font-size:11px;color:#666;margin-bottom:.75rem">Your key is stored only in this browser and only sent to Anthropic when you ask a question. Get a key at <strong>console.anthropic.com</strong>.</div>
      <div style="display:flex;gap:8px">
        <input type="password" id="ai-key-inp" placeholder="sk-ant-..." style="flex:1;font-family:monospace;font-size:12px">
        <button class="btn btn-p" onclick="const k=document.getElementById('ai-key-inp').value.trim();if(k){S.aiKey=k;saveAIKey(k);render();}else{showToast('Paste your API key first',true);}">Save key</button>
      </div>
    </div>`:`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.25rem">
      <div style="font-size:12px;color:#1D9E75;font-weight:500">&#x2713; API key set</div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" onclick="S.aiMessages=[];render()">Clear chat</button>
        <button class="btn btn-sm btn-d" onclick="S.aiKey='';try{localStorage.removeItem('${AI_SK}');}catch(e){}render()">Remove key</button>
      </div>
    </div>`}
    ${S.aiMessages.length===0&&keySet?`<div>
      <div style="font-size:12px;font-weight:500;color:#888;margin-bottom:.5rem">Suggested questions</div>
      <div class="ai-suggestions">${suggestions.map(s=>`<button class="ai-sug" onclick="askSuggestion('${s}')">${s}</button>`).join('')}</div>
    </div>`:''}
    <div class="ai-messages" id="ai-msgs" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.75rem;padding-bottom:.5rem">
      ${S.aiMessages.length===0&&keySet?`<div class="ai-msg system">Ask me anything about your schedule. I can see all your clients, staff, pods, and current assignments.</div>`:''}
      ${msgsHtml}${typingHtml}
    </div>
    ${keySet?`<div class="ai-input-row">
      <textarea id="ai-inp" placeholder="Ask about your schedule... e.g. &quot;Alex called out Monday — who can cover?&quot;" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAIMessage();}"
        oninput="this.style.height='44px';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
      <button class="ai-send" onclick="sendAIMessage()" ${S.aiLoading?'disabled':''}>Send</button>
    </div>`:''}
  </div>`;
}

function render(){
  const mc=document.getElementById('mc');if(!mc)return;
  const block=['pods','data','save','ai'];mc.style.display=block.includes(S.tab)?'block':'flex';
  window._BM={};
  if(S.tab==='today')mc.innerHTML=rToday();
  else if(S.tab==='week')mc.innerHTML=rWeek();
  else if(S.tab==='clients')mc.innerHTML=rClients();
  else if(S.tab==='staff')mc.innerHTML=rStaff();
  else if(S.tab==='pods')mc.innerHTML=rPods();
  else if(S.tab==='callout')mc.innerHTML=rCallout();
  else if(S.tab==='data')mc.innerHTML=rData();
  else if(S.tab==='save')mc.innerHTML=rSave();
  else if(S.tab==='ai')mc.innerHTML=rAI();
  updSI();
}

tryLoad();
render();
</script>
</body>
</html>
